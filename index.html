num:3, title:"Python for Data Analysis", short:"Python",
intro:"Python — and pandas in particular — is the analyst's power tool for work that outgrows spreadsheets. Interviewers probe here to confirm you can manipulate data programmatically, write readable code, and think about performance when datasets grow. These fifteen questions focus on what analysts actually use daily: loading, cleaning, joining, aggregating, and reshaping data.",
covers:["pandas essentials: loc, groupby, merge","Missing data, duplicates & dtypes","Vectorization & performance","Core Python data structures"],
qa:[
{q:"How do you load and inspect a new dataset in pandas?",level:"Foundational",tags:["pandas","EDA"],a:
`~~~python
import pandas as pd

df = pd.read_csv('orders.csv')          # or read_excel, read_sql, read_parquet

df.head()          # first 5 rows — does it look as expected?
df.tail()          # last rows — footers and junk often hide here
df.shape           # (rows, columns)
df.info()          # dtypes, non-null counts, memory usage
df.describe()      # numeric summary stats
df.sample(5)       # random rows — avoids head/tail bias
df.nunique()       # cardinality per column
df.isna().sum()    # missing values per column
~~~

### What I'm actually checking
- **Dtypes:** are dates strings? Numbers stored as objects?
- **Missingness:** which columns, and how much?
- **Sanity ranges:** negative prices, dates in the future
- **Grain:** what does one row represent? (This question prevents most downstream errors.)

> Mentioning {{pd.read_csv(..., parse_dates=['order_date'])}} and checking {{df.duplicated().sum()}} shows a battle-tested inspection routine rather than a tutorial one.`},

{q:"What is the difference between loc and iloc?",level:"Foundational",tags:["pandas","Indexing"],a:
`Both select data from a DataFrame; they differ in **how you address positions**.

- **{{loc}}** — label-based. Uses index labels and column names. Slices are **inclusive** of the end label.
- **{{iloc}}** — integer-position-based. Uses 0-based positions, like Python lists. Slices are **exclusive** of the end.

~~~python
df.loc[3:5, 'name']        # rows labeled 3, 4, AND 5
df.iloc[3:5, 0]            # rows at positions 3 and 4 only

df.loc[df['age'] > 30, ['name', 'salary']]   # boolean filtering — loc's superpower
df.iloc[0, 0]              # single cell by position
~~~

### The classic trap
After filtering or sorting, the index keeps its **original labels**. If rows 2 and 7 were dropped, {{df.loc[2]}} raises a KeyError while {{df.iloc[2]}} happily returns the third row. Confusing the two after subsetting is a common source of silent bugs.

> Rule of thumb: use {{loc}} with conditions and column names (99% of analyst work); reach for {{iloc}} when you truly need positional slicing.`},

{q:"How do you handle missing data in pandas?",level:"Foundational",tags:["pandas","Cleaning"],a:
`### First, understand it
~~~python
df.isna().sum()                      # count per column
df.isna().mean().sort_values()       # proportion per column
~~~
Ask *why* values are missing — the mechanism determines the right treatment.

### Drop
~~~python
df.dropna()                          # rows with any NaN
df.dropna(subset=['email'])          # only if key columns are missing
df.dropna(thresh=10)                 # keep rows with ≥10 non-nulls
~~~
Safe when missingness is small and random.

### Fill
~~~python
df['age'].fillna(df['age'].median())     # median resists outliers
df['plan'].fillna('unknown')             # explicit category beats silent NaN
df['price'].fillna(method='ffill')       # carry forward (time series)
df['temp'].interpolate()                 # estimate from neighbors
~~~

### The professional touches
- Create a **missingness indicator** ({{df['age_missing'] = df['age'].isna()}}) — the fact that data is missing is often itself informative
- Never silently fill before a join or aggregation without checking the impact
- Document every imputation decision

> Interviewers want to hear "it depends on the mechanism" — MCAR, MAR, MNAR — before any code.`},

{q:"Explain how groupby works in pandas, with aggregation examples.",level:"Intermediate",tags:["pandas","Aggregation"],a:
`groupby implements **split–apply–combine**: split data into groups, apply a function to each, combine the results.

~~~python
# Simple aggregation
df.groupby('region')['revenue'].sum()

# Multiple aggregations, named output columns (the modern, readable way)
summary = (df.groupby('region')
             .agg(total_rev=('revenue', 'sum'),
                  avg_order=('revenue', 'mean'),
                  customers=('customer_id', 'nunique'))
             .reset_index())

# Group by multiple keys
df.groupby(['region', 'quarter'])['revenue'].sum()
~~~

### The three siblings — know the difference
- **{{agg}}** — collapses each group to summary row(s)
- **{{transform}}** — returns a value *per original row* (e.g., each row's share of its group total: {{df['rev'] / df.groupby('region')['rev'].transform('sum')}})
- **{{apply}}** — flexible but slow; a last resort

### Handy extras
{{groupby(...).nth(0)}} for first record per group, {{.size()}} for group counts, and {{as_index=False}} to keep groups as columns.

> {{transform}} for computing "percent of group total" without a merge is a genuinely impressive detail to mention.`},

{q:"merge vs concat vs join in pandas — when do you use each?",level:"Intermediate",tags:["pandas","Combining Data"],a:
`### merge — SQL-style joins on keys
~~~python
orders.merge(customers, on='customer_id', how='left')
orders.merge(customers, left_on='cust_id', right_on='id', how='inner')
~~~
Supports {{how}} = inner, left, right, outer — the workhorse for combining tables on shared columns.

### concat — stacking
~~~python
pd.concat([jan, feb, mar])                 # stack rows (axis=0)
pd.concat([df1, df2], axis=1)              # side by side
~~~
No key matching — it simply glues along an axis. Perfect for appending monthly files.

### join — merge on indexes
~~~python
df1.join(df2)        # joins on index by default
~~~
Essentially a convenience wrapper around merge for index-aligned data.

### Details that impress
- {{validate='1:m'}} in merge asserts the relationship you expect — catches accidental fan-outs that silently inflate metrics
- Always check row counts before and after a merge
- {{indicator=True}} adds a column showing which side each row came from — invaluable for debugging joins

> The row-multiplication bug from a many-to-many merge is the pandas equivalent of the JOIN fan-out — name it and you sound like you've been burned before (in a good way).`},

{q:"Why are vectorized operations preferred over apply and loops in pandas?",level:"Intermediate",tags:["pandas","Performance"],a:
`pandas is built on NumPy, whose operations execute in **compiled C over contiguous memory**. A Python-level loop — including the one hiding inside {{apply}} — pays interpreter overhead **per element**.

~~~python
# Slow: Python-level loop in disguise
df['segment'] = df['revenue'].apply(lambda x: 'high' if x > 1000 else 'low')

# Fast: vectorized
import numpy as np
df['segment'] = np.where(df['revenue'] > 1000, 'high', 'low')

# Multiple conditions
df['tier'] = np.select(
    [df['revenue'] > 5000, df['revenue'] > 1000],
    ['gold', 'silver'],
    default='bronze')
~~~

On a million rows, vectorized code commonly runs **50–500× faster**.

### The performance hierarchy
1. **Vectorized NumPy/pandas ops** — always first choice
2. **{{np.where}} / {{np.select}}** — conditional logic
3. **{{apply}}** — acceptable for genuinely complex row logic on small data
4. **{{iterrows}} / for-loops** — avoid; if you're here, rethink the approach

> The deeper point: vectorization is also more *readable* — it expresses the transformation on the whole column as one idea. Speed and clarity align.`},

{q:"Compare Python's list, tuple, set, and dictionary.",level:"Foundational",tags:["Python Core"],a:
`| | Mutable | Ordered | Duplicates | Best for |
| list | Yes | Yes | Allowed | General sequences, stacking results |
| tuple | No | Yes | Allowed | Fixed records, dict keys, safe returns |
| set | Yes | No | No | Membership tests, deduplication |
| dict | Yes (keys immutable) | Yes (3.7+) | Keys unique | Lookups, mappings, JSON-like data |

~~~python
tags   = ['sql', 'python', 'sql']        # list: keeps duplicates
point  = (40.7, -74.0)                   # tuple: fixed structure
uniq   = set(tags)                       # {'sql', 'python'}: deduped
prices = {'basic': 9, 'pro': 29}         # dict: O(1) lookup
~~~

### Analyst-relevant notes
- **{{x in my_set}}** is O(1); {{x in my_list}} is O(n) — converting a lookup list to a set can transform performance on big data
- Tuples' immutability makes them valid **dict keys**; lists are not
- Dicts are the backbone of JSON handling and quick mapping tables ({{country_code → name}})

> Interviewers ask this to confirm your fundamentals aren't purely pandas-deep. The set-vs-list membership cost is the detail that signals real coding experience.`},

{q:"What are list comprehensions, and when should you avoid them?",level:"Foundational",tags:["Python Core"],a:
`A list comprehension builds a list in one expressive line:

~~~python
# [expression for item in iterable if condition]
squares   = [x**2 for x in range(10)]
even_vals = [x for x in values if x % 2 == 0]
names     = [u['name'].strip().title() for u in users]
~~~

Equivalent to — and usually faster and clearer than — a for-loop with {{append}}, or {{map()}}/{{filter()}} chains.

### Variants
~~~python
{x**2 for x in range(5)}            # set comprehension
{x: x**2 for x in range(5)}         # dict comprehension
(x**2 for x in range(10**9))        # generator — lazy, memory-efficient
~~~

### When to avoid them
- **Logic spans multiple conditions or transformations** — a nested three-clause comprehension is unreadable; write the loop
- **You need side effects** (logging, API calls) — comprehensions are for building collections
- **Huge data** — a generator expression {{( ... )}} streams items one at a time instead of materializing a giant list

> The generator-expression point doubles as a memory-management answer — mentioning lazy evaluation shows you think about scale.`},

{q:"Explain mutable vs immutable types in Python, with a practical gotcha.",level:"Intermediate",tags:["Python Core"],a:
`- **Immutable** — cannot change after creation: {{int}}, {{float}}, {{str}}, {{tuple}}, {{frozenset}}. "Modifying" one creates a new object.
- **Mutable** — can change in place: {{list}}, {{dict}}, {{set}}.

### Gotcha 1: The mutable default argument
~~~python
def add_item(item, basket=[]):     # DANGER: one list shared across calls
    basket.append(item)
    return basket

add_item('a')   # ['a']
add_item('b')   # ['a', 'b']  ← surprise!
~~~
The default is evaluated **once** at function definition. Fix: default to {{None}} and create the list inside.

### Gotcha 2: Assignment doesn't copy
~~~python
a = [1, 2, 3]
b = a            # b is the SAME list
b.append(4)      # a is now [1, 2, 3, 4]
c = a.copy()     # a true (shallow) copy
~~~

### Why analysts care
Passing DataFrames between functions, building config dicts, caching intermediate results — aliasing bugs silently corrupt analysis. Knowing when you're holding a *reference* versus a *copy* prevents a whole class of "the numbers changed and I don't know why" bugs.`},

{q:"Your CSV is larger than RAM. How do you analyze it in Python?",level:"Advanced",tags:["Performance","Big Data"],a:
`Several escalating strategies:

### 1. Load less
~~~python
cols = ['date', 'region', 'revenue']
df = pd.read_csv('huge.csv', usecols=cols)          # skip unneeded columns
~~~

### 2. Shrink dtypes
~~~python
df = pd.read_csv('huge.csv', dtype={'region': 'category',
                                    'qty': 'int16',
                                    'price': 'float32'})
~~~
Categoricals and downcast numerics routinely cut memory 5–10×.

### 3. Process in chunks
~~~python
total = 0
for chunk in pd.read_csv('huge.csv', chunksize=500_000):
    total += chunk['revenue'].sum()      # aggregate incrementally
~~~
Chunked aggregation handles files of almost any size.

### 4. Switch tools
- **Polars / DuckDB** — multi-threaded, out-of-core, often 10–50× faster than pandas on large files
- **Dask** — parallel, partitioned DataFrames
- **Push computation to the database** — let the warehouse aggregate; pull only results
- **Sample first** — explore on 1% of rows, then run the final pass on everything

> The strategic answer: "use the right tool for the data size, and explore on samples before committing to full processing" — that's how seniors frame it.`},

{q:"A pandas script is painfully slow. How do you speed it up?",level:"Advanced",tags:["Performance"],a:
`### First: measure
Profile before optimizing — {{%timeit}}, {{cProfile}}, or simply timing sections. The bottleneck is rarely where you assume.

### The usual suspects, in order of payoff
1. **Replace loops/apply with vectorization** — the single biggest win (see the vectorization question)
2. **{{iterrows()}} → {{itertuples()}}** if you must iterate (much faster), or better, eliminate the loop
3. **Categorical dtypes** for low-cardinality strings — faster groupbys, less memory
4. **Avoid repeated column-wise concatenation in loops** ({{df = df.append(...)}} is quadratic); collect in a list and concat once
5. **Read smarter:** {{usecols}}, {{dtype}}, or switch from CSV to **Parquet** (columnar, compressed, 10–100× faster reads)
6. **{{query()}} / {{eval()}}** for large-frame filtering and arithmetic
7. **Bigger hammers:** Polars, DuckDB, Dask, or NumPy directly via {{.to_numpy()}}

### Example
~~~python
# Before: row-wise string parsing with apply
# After: vectorized string methods
df['domain'] = df['email'].str.split('@').str[1]
~~~

> Framing matters: "profile first, vectorize second, change tools last" is a complete, senior-grade answer in one sentence.`},

{q:"What are lambda functions, and when would you use one?",level:"Foundational",tags:["Python Core"],a:
`A lambda is a small **anonymous function** defined in a single expression:

~~~python
square = lambda x: x**2
square(5)        # 25
~~~

### Where they shine — short, throwaway logic
~~~python
# Sorting by a computed key
users.sort(key=lambda u: u['last_login'], reverse=True)

# Quick transforms
df['label'] = df['score'].apply(lambda s: 'pass' if s >= 70 else 'fail')

# Custom key in max/min
best = max(deals, key=lambda d: d['margin'])
~~~

### Limitations
- **Single expression only** — no statements, no multi-line logic
- No name, no docstring — hurts debugging and readability when complex
- If the lambda grows past a glance, write a proper {{def}}:

~~~python
def classify(score):
    if score >= 90: return 'A'
    if score >= 70: return 'B'
    return 'C'
~~~

> A tasteful answer acknowledges the style debate: lambdas are idiomatic for keys and simple mappings; anything with branches deserves a named function. Readability is a feature.`},

{q:"How do you create a pivot table in pandas, and what is its inverse operation?",level:"Intermediate",tags:["pandas","Reshaping"],a:
`~~~python
pivot = pd.pivot_table(
    df,
    index='region',            # rows
    columns='quarter',         # columns
    values='revenue',          # cell values
    aggfunc='sum',             # how to aggregate ('mean', 'count', list of funcs)
    fill_value=0,              # replace NaN for empty combos
    margins=True,              # add totals row/column
    margins_name='Total')
~~~

This mirrors Excel's PivotTable — long data in, wide summary out.

### The inverse: melt (wide → long)
~~~python
long = pivot.drop(index='Total', columns='Total').reset_index() \
            .melt(id_vars='region', var_name='quarter', value_name='revenue')
~~~

### When each direction matters
- **Wide (pivot):** human-readable reports, side-by-side comparisons, dashboard tables
- **Long (melt):** the format databases, groupbys, and plotting libraries prefer — "tidy data"

### Related tools
- {{pd.crosstab()}} — pivot specialized for frequency counts
- {{df.unstack()}} / {{df.stack()}} — reshaping via the index

> Knowing that visualization tools generally want *long* data while executives want *wide* tables — and that you can move between them fluently — is a very practical analyst insight.`},

{q:"How do you find and handle duplicate records in pandas?",level:"Foundational",tags:["pandas","Cleaning"],a:
`~~~python
# Detect
df.duplicated().sum()                          # count of full-row duplicates
df[df.duplicated(subset=['email'], keep=False)]  # show ALL rows with dup emails

# Remove
df = df.drop_duplicates()                                  # exact row dupes
df = df.drop_duplicates(subset=['email'], keep='last')     # keep newest
df = df.drop_duplicates(subset=['email'], keep=False)      # drop ALL copies
~~~

### The {{keep}} parameter — the part that matters
- {{'first'}} (default) / {{'last'}} — which copy survives
- {{False}} — remove every row involved in duplication

### A real-world dedup pattern
~~~python
df = (df.sort_values('updated_at')
        .drop_duplicates(subset='customer_id', keep='last'))
~~~
Sort by recency first, then keep the last — a deliberate **survivorship rule** instead of an arbitrary one.

### Beyond exact matches
Real duplicates are often fuzzy: 'Jon Smith' vs 'John Smyth', different casing, extra whitespace. Standardize first ({{str.lower().str.strip()}}), and for serious entity resolution look at fuzzy matching ({{rapidfuzz}}) or record-linkage techniques.

> Stating your survivorship rule out loud — and noting that dedup decisions should be documented — is what turns a syntax answer into an analyst answer.`},

{q:"How do you work with dates and times in pandas?",level:"Intermediate",tags:["pandas","Time Series"],a:
`### Parsing
~~~python
df['date'] = pd.to_datetime(df['date'])                          # infer format
df['date'] = pd.to_datetime(df['date'], format='%d/%m/%Y')       # explicit = faster + safer
pd.to_datetime(df['date'], errors='coerce')                      # bad values → NaT instead of crashing
~~~

### Extracting components
~~~python
df['month']    = df['date'].dt.month
df['dow']      = df['date'].dt.day_name()
df['week']     = df['date'].dt.isocalendar().week
df['quarter']  = df['date'].dt.quarter
~~~

### Resampling — the time-series superpower
~~~python
df.set_index('date').resample('M')['revenue'].sum()     # monthly totals
df.set_index('date').resample('W')['users'].mean()      # weekly averages
~~~

### Arithmetic and ranges
~~~python
df['days_since'] = (pd.Timestamp.today() - df['date']).dt.days
pd.date_range('2024-01-01', periods=12, freq='M')       # calendar spine
~~~

### Time zones
{{dt.tz_localize('UTC')}} and {{dt.tz_convert('America/New_York')}} — timezone bugs are a classic source of "yesterday's numbers changed" mysteries.

> The pro habit: parse dates at load time, never leave them as strings, and build a date spine when periods might be missing — gaps silently break month-over-month math.`}
]},

{q:"VLOOKUP vs INDEX-MATCH vs XLOOKUP — compare them.",level:"Foundational",tags:["Lookups","Formulas"],a:
`All three retrieve a value from a table based on a key — with important differences.

### VLOOKUP
~~~excel
=VLOOKUP(A2, Products!A:D, 4, FALSE)
~~~
Limitations: can only look **rightward** (key must be in the first column), the hard-coded column index **breaks when columns are inserted**, and it defaults to approximate match — the {{FALSE}} is easy to forget and dangerous.

### INDEX-MATCH
~~~excel
=INDEX(Products!D:D, MATCH(A2, Products!A:A, 0))
~~~
Looks **any direction**, immune to inserted columns, and faster on large ranges. Two functions, but bulletproof.

### XLOOKUP (Excel 365)
~~~excel
=XLOOKUP(A2, Products!A:A, Products!D:D, "Not found")
~~~
Looks any direction, exact match **by default**, built-in if-not-found, and can return arrays. The modern default.

| | VLOOKUP | INDEX-MATCH | XLOOKUP |
| Left lookup | No | Yes | Yes |
| Column-insert safe | No | Yes | Yes |
| Exact by default | No | Yes | Yes |
| Availability | Everywhere | Everywhere | 365 / 2021+ |

> Saying "XLOOKUP when available, INDEX-MATCH for backward compatibility, VLOOKUP only when maintaining legacy sheets" is the polished professional answer.`},

{q:"What are PivotTables, and how do you use them effectively?",level:"Foundational",tags:["PivotTables","Summarization"],a:
`A PivotTable summarizes large datasets by dragging fields into **Rows, Columns, Values, and Filters** — no formulas required. It's the fastest exploratory tool in Excel.

### A typical workflow
Sales data with date, region, product, revenue → drag Region to Rows, Quarter to Columns, Revenue to Values (Sum) → instant cross-tab of revenue by region and quarter.

### Features that elevate your answer
- **Value settings:** switch Sum → Average, Count, % of Grand Total
- **Grouping:** right-click dates → group by month/quarter/year
- **Slicers & timelines:** visual filter buttons that make PivotTables interactive
- **Calculated fields:** add derived metrics (margin = profit / revenue) inside the pivot
- **Refresh:** pivots cache data — {{Refresh All}} after source changes (or set refresh-on-open)

### Common gotchas
- Source range must include all data — convert to an **Excel Table** (Ctrl+T) so the range auto-expands
- Blanks in the data break grouping and counts
- Changing source data does **not** auto-update the pivot

> The strategic framing: PivotTables are for *exploration and ad-hoc answers*; for repeatable reporting, formulas or a BI tool are more auditable.`},

{q:"Explain absolute vs relative cell references.",level:"Foundational",tags:["Formulas","Fundamentals"],a:
`References control how formulas behave when **copied**.

- **Relative** {{=A2*B2}} — shifts when copied. Copy down one row → {{=A3*B3}}.
- **Absolute** {{=$A$2}} — locked; never shifts. The $ anchors column and/or row.
- **Mixed** {{=$A2}} or {{=A$2}} — lock one dimension only.

### The classic example
Multiplying a column of prices by a single tax rate in cell E1:

~~~excel
=B2*$E$1
~~~
Copy down: B2 becomes B3, B4… but $E$1 stays fixed. Without the $, the reference drifts to E2, E3 — and every result below the first is wrong.

### Mixed references in practice
Building a multiplication table or a price × quantity matrix: {{=$A2*B$1}} — column locked on the row header, row locked on the column header — one formula fills the entire grid.

### Pro detail
**F4** cycles reference types while editing. And named ranges ({{=B2*TaxRate}}) make models self-documenting — a hallmark of professional spreadsheets.

> This seems basic, but reference discipline is exactly what separates auditable models from fragile ones. Interviewers for finance-adjacent roles probe it hard.`},

{q:"How do SUMIFS, COUNTIFS, and IFS work? Give examples.",level:"Intermediate",tags:["Formulas","Aggregation"],a:
`The *IFS family applies **multiple criteria** to aggregation — the spreadsheet equivalent of SQL's WHERE with AND conditions.

~~~excel
=SUMIFS(D:D, B:B, "East", C:C, ">=2024-01-01")
   sum of D where region is East AND date is in 2024+

=COUNTIFS(B:B, "East", D:D, ">1000")
   count of East orders over 1000

=AVERAGEIFS(D:D, B:B, "West", C:C, "<>")   -- non-blank dates
~~~

### Syntax notes
- SUMIFS puts the **sum range first** (SUMIF put it last — a famous inconsistency)
- Criteria support wildcards ({{"A*"}}) and operators as strings ({{">="&E1}})
- All conditions are ANDed; OR logic needs multiple SUMIFS added together or SUMPRODUCT

### IFS — cleaner branching
~~~excel
=IFS(A2>=90,"A", A2>=80,"B", A2>=70,"C", TRUE,"F")
~~~
Replaces deeply nested IFs; evaluated in order, first TRUE wins.

> Analysts live in SUMIFS for quick reconciliation questions ("what were East-region returns last quarter?"). Mentioning that PivotTables often answer the same questions faster shows tool judgment.`},

{q:"Which text functions do you rely on most for data cleaning?",level:"Intermediate",tags:["Text Functions","Cleaning"],a:
`Real-world data arrives messy; these are the workhorses.

~~~excel
=TRIM(A2)                 -- removes extra spaces (invisible data-killers)
=CLEAN(A2)                -- strips non-printable characters
=UPPER / LOWER / PROPER   -- standardize case
=LEFT(A2,3) / RIGHT(A2,4) / MID(A2,5,2)
=LEN(A2)                  -- spot anomalies (ZIP codes of length 4?)
=TEXTSPLIT(A2,",")        -- split "Last, First" into columns (365)
=TEXTJOIN(", ",TRUE,range) -- concatenate with delimiter, skip blanks
=SUBSTITUTE(A2,"-","")    -- strip dashes from phone numbers
=FIND("@",A2)             -- position of a character (for parsing)
=TEXT(B2,"yyyy-mm")       -- format dates as sortable strings
~~~

### A realistic parse
Extract the domain from an email:

~~~excel
=MID(A2, FIND("@",A2)+1, LEN(A2))
~~~

### The analyst's framing
Text functions are for **one-off cleanup and exploration**. If the same parsing runs every week, it belongs in Power Query, Python, or SQL — repeatable beats manual.

> TRIM is the unglamorous hero: trailing spaces silently break lookups and deduplication. Mentioning that earns knowing nods.`},

{q:"How do you remove duplicates and enforce data quality in Excel?",level:"Foundational",tags:["Data Quality"],a:
`### Removing duplicates
**Data → Remove Duplicates** — choose the columns that define uniqueness (email only? full row?) and Excel keeps the first occurrence. Always copy the data first; the operation is destructive.

For non-destructive flagging:

~~~excel
=COUNTIF($A$2:$A$1000, A2) > 1        -- TRUE for duplicates
=COUNTIF($A$2:A2, A2) = 1             -- TRUE for first occurrence only
~~~

The expanding-range trick ({{$A$2:A2}}) labels each row as first-seen or repeat — perfect for filtering.

### Preventing bad data — Data Validation
- **Lists:** dropdowns restricting entries to valid values (kills 'NY' vs 'New York')
- **Rules:** dates within range, numbers between bounds, text length limits
- **Custom formulas:** e.g., reject entries already in the column

### Conditional formatting for QA
Highlight duplicates, blanks, outliers, or values breaking business rules — visual audits catch what formulas miss.

> The layered answer — prevent (validation), detect (COUNTIF/conditional formatting), correct (remove duplicates) — mirrors professional data-quality thinking in miniature.`},

{q:"How do you use conditional formatting in analysis?",level:"Foundational",tags:["Visualization","Excel"],a:
`Conditional formatting changes cell appearance based on values — turning a wall of numbers into a scannable surface.

### The analyst's toolkit
- **Color scales** — instant heat maps: a 12-month × region revenue grid becomes a pattern-finding exercise
- **Data bars** — in-cell bar charts for magnitude comparison
- **Icon sets** — arrows/flags for KPI status (use sparingly)
- **Highlight rules** — top 10%, below average, duplicates, blanks
- **Formula-based rules** — the powerful one:

~~~excel
=$D2<$C2        -- highlight entire rows where actual < target
=AND($B2="East", $D2>10000)   -- compound business logic
~~~

### Formula-rule essentials
Write the formula for the **top-left cell** of the range, use **mixed references** ({{$D2}} locks the column so the whole row highlights), and Excel applies it relatively across the selection.

### Good judgment
Conditional formatting is for **pattern detection and exception flagging**, not decoration. One clear rule beats five competing ones; if everything is highlighted, nothing is.

> Mentioning performance — heavy conditional formatting on 100k-row sheets slows Excel noticeably — shows you've used it at real scale.`},

{q:"What are Excel's what-if analysis tools, and when would you use each?",level:"Intermediate",tags:["Modeling","What-If"],a:
`Excel offers three tools for exploring "what would it take" questions.

### Goal Seek — solve for one input
"Revenue must hit $1.2M — what growth rate gets us there?" Set the output cell to a target value by changing one input cell. Excel backsolves iteratively. Perfect for single-variable targets.

### Scenario Manager — compare named situations
Store sets of inputs as named scenarios — *Pessimistic / Base / Optimistic* — and switch the whole model between them, or produce a summary table comparing outcomes side by side.

### Data Tables — sensitivity grids
Vary **one or two inputs** across a range and watch an output change:
- One-variable: how does profit change as price moves from $20 to $40?
- Two-variable: profit across price × volume combinations — the classic sensitivity matrix

### Solver (add-in) — the big sibling
Optimize an objective (maximize profit) subject to **constraints** (budget ≤ X, capacity ≤ Y) by changing many variables — linear programming inside Excel.

> A strong answer frames these as decision-support tools: analysts don't just report what happened — they model what levers would change it. That's the mindset interviewers are screening for.`},

{q:"What are dynamic array formulas in modern Excel?",level:"Advanced",tags:["Formulas","Modern Excel"],a:
`Dynamic arrays (Excel 365/2021) let **one formula return multiple values that spill** into neighboring cells — no Ctrl+Shift+Enter, no copying down.

### The transformative functions
~~~excel
=UNIQUE(A2:A10000)                    -- deduped list, spills automatically
=SORT(UNIQUE(A2:A10000))              -- sorted unique list
=FILTER(A2:D10000, B2:B10000="East")  -- all East rows, live
=SORTBY(data, revenue, -1)            -- sort by another column
=SEQUENCE(12,1,DATE(2025,1,1),31)     -- generate date lists
=XLOOKUP(key, keys, results)          -- modern lookup
~~~

### The spill behavior
A formula in E2 returning 50 rows fills E2:E51. If something blocks the spill range → {{#SPILL!}} error. Reference the whole spilled result with {{E2#}}.

### Why this changes analyst workflows
- **Live distinct-count lists** without pivot refreshes
- **FILTER replaces** helper columns + autofilter gymnastics
- Chained formulas ({{SORT(UNIQUE(FILTER(...)))}}) behave like mini query pipelines — Excel inching toward SQL

> Noting the compatibility caveat — dynamic arrays don't work in older Excel versions, so shared workbooks may need legacy approaches — shows practical judgment.`},

{q:"Walk me through common Excel errors and how you handle them.",level:"Foundational",tags:["Errors","Debugging"],a:
`| Error | Meaning | Typical fix |
| #N/A | Lookup found nothing | Verify key formats (spaces! types!); wrap in IFNA |
| #REF! | Formula points to deleted cells | Rebuild reference; avoid deleting referenced ranges |
| #DIV/0! | Division by zero/blank | Guard denominator; IFERROR |
| #VALUE! | Wrong data type (text in math) | Clean types; check for stray spaces |
| #NAME? | Unrecognized function/range name | Typos; missing add-in; old Excel version |
| #SPILL! | Dynamic array blocked | Clear the spill range |
| #NULL! | Bad range intersection | Usually a space where a comma belonged |

### Graceful handling
~~~excel
=IFERROR(VLOOKUP(A2,Table,2,FALSE), "Not found")
=IFNA(XLOOKUP(A2,K,V), "—")        -- only catches #N/A (more precise)
~~~

### The professional nuance
- **IFNA over IFERROR for lookups** — IFERROR masks *everything*, including the #REF! that warns you the model broke
- Don't blanket-wrap formulas to hide errors during development — fix causes first, then add guards for presentation
- A dashboard full of silent "Not found" values can hide a broken data feed; consider a visible QA cell counting errors

> Debugging mindset matters more than the table: read the error, trace precedents (Formulas → Trace), and fix the root cause. That's the answer behind the answer.`}
]},

num:5, title:"Data Visualization & BI", short:"Visualization",
intro:"An insight nobody understands is worth nothing. This chapter covers the craft of turning analysis into decisions: choosing the right chart, designing dashboards people actually use, and presenting to executives with confidence. Interviewers use these questions to assess whether you can communicate — the skill that ultimately determines an analyst's impact.",
covers:["Chart selection & visual design","Dashboard principles that drive adoption","Power BI / Tableau / DAX fluency","Executive communication & storytelling"],
qa:[
{q:"How do you choose the right chart for your data?",level:"Foundational",tags:["Chart Selection","Design"],a:
`Start with the **message**, not the data. What should the audience conclude?

| Intent | Best choice |
| Compare categories | Bar chart (horizontal for long labels) |
| Trend over time | Line chart |
| Part of a whole | Stacked bar; pie only for ≤4 slices |
| Distribution | Histogram or box plot |
| Relationship between variables | Scatter plot |
| Single KPI | Big number with context (target, delta) |
| Geographic patterns | Map (only if geography is the story) |
| Funnel stages | Funnel or ordered bar |

### Rules I hold firmly
- **Bars over pies** — humans compare lengths far better than angles
- **Start bar charts at zero** — truncating a bar axis lies visually
- **Time goes left to right**, almost always as a line
- **No 3D, ever** — it distorts every value it touches
- If a chart needs a paragraph to explain, it's the wrong chart

### The test
Show the chart to someone for five seconds, take it away, and ask what they remember. If it's not your message, redesign.

> Mentioning the five-second test — or naming your intent before naming a chart type — immediately signals design maturity.`},

{q:"What are the principles of an effective dashboard?",level:"Intermediate",tags:["Dashboards","Design"],a:
`### 1. Audience and decision first
A dashboard exists to drive **decisions**, not to display data. An executive scorecard, an ops monitor, and an analyst's exploratory view are three different products.

### 2. Hierarchy and the 5-second rule
Most important number top-left (where eyes land first). A viewer should grasp the headline in five seconds; detail lives below or behind drill-downs.

### 3. Context makes numbers meaningful
A KPI without a target, prior period, or benchmark is trivia. Show: value, **vs goal**, **vs last period**, trend sparkline.

### 4. Ruthless simplicity
Every element competes for attention. Remove chartjunk, limit to ~5–9 visuals per view, use consistent scales, and let whitespace do its job.

### 5. Consistency and convention
Same metric = same color everywhere; time axes aligned; filters behave predictably; number formatting consistent (decimals, units, thousands separators).

### 6. Accessibility
Colorblind-safe palettes, adequate contrast, never encode meaning in color alone.

### 7. Iterate with users
Ship v1, watch how people actually use it, cut what they ignore. Adoption is the success metric.

> The killer closing line: "A dashboard nobody opens is a failure no matter how beautiful it is — I measure mine by usage and by decisions changed."`},

{q:"Power BI vs Tableau vs Looker — how do you compare them?",level:"Intermediate",tags:["Tools","BI"],a:
`An honest comparison — interviewers distrust fanaticism in either direction.

### Power BI
- **Strengths:** deep Microsoft integration (Excel, Teams, Azure), aggressive pricing, powerful modeling via DAX, rapid feature cadence
- **Best for:** organizations standardized on Microsoft; strong self-serve with governed semantic models
- **Watch-outs:** DAX has a steep learning curve; Mac support is weak

### Tableau
- **Strengths:** best-in-class visual exploration and polish, huge community, flexible connections
- **Best for:** analysis-heavy teams, visual storytelling, mixed data environments
- **Watch-outs:** cost at scale; data modeling less rigorous than Power BI's

### Looker (Google Cloud)
- **Strengths:** LookML — a governed, version-controlled **semantic layer**; metrics defined once, reused everywhere; strong embedded analytics
- **Best for:** data-mature companies wanting metric consistency at scale
- **Watch-outs:** requires developer involvement; less drag-and-drop friendly

### The analyst's real answer
The tools converge more each year. What transfers everywhere: **dimensional modeling, metric definitions, and design judgment**. I'd rather hire someone who understands star schemas and can learn any tool than a button-clicker in one.

> If asked to "pick one," pick based on context (ecosystem, budget, team skills) — the reasoning is what's being graded.`},

{q:"What makes a good KPI?",level:"Intermediate",tags:["Metrics","Business"],a:
`A KPI is not just a number — it's a number that **changes behavior**. Good KPIs share these traits:

### The criteria
- **Tied to a business objective** — if hitting the KPI doesn't advance a goal, it's decoration
- **Actionable** — the team can influence it; "stock price" fails this for a support team
- **Measurable and well-defined** — one canonical formula everyone agrees on ("active user" needs a written definition)
- **Owned** — a named person/team accountable for moving it
- **Comparable** — against targets, history, or benchmarks
- **Leading where possible** — leading indicators (weekly active users) predict; lagging ones (quarterly revenue) confirm. You need both, but leading metrics let you act in time

### Vanity vs actionable
- Vanity: total registered users (only goes up, drives nothing)
- Actionable: weekly activation rate of new signups (movable, diagnostic)

### Examples by domain
- E-commerce: conversion rate, AOV, repeat purchase rate
- SaaS: MRR, churn, NRR, activation
- Support: first-response time, CSAT, resolution rate

> The acid test I use: "If this number moved 20% tomorrow, would anyone do something differently?" If not, it's a metric, not a KPI.`},

{q:"How do you tell a compelling story with data?",level:"Intermediate",tags:["Storytelling","Communication"],a:
`Data storytelling is structure plus empathy for the audience.

### The narrative arc
1. **Context** — what the business cares about and why we're looking at this now
2. **Conflict** — the finding: churn is rising in a specific cohort; a funnel step is leaking
3. **Resolution** — the recommendation: what to do, expected impact, and what happens if we don't

### Principles that make it land
- **One message per visual.** If a chart supports two points, split it.
- **Lead with the "so what."** Executives want the conclusion first (BLUF — bottom line up front), evidence after.
- **Annotate, don't decorate.** A well-placed callout ("pricing changed here") beats a legend hunt.
- **Speak in their units.** Revenue, customers, hours saved — not p-values and row counts.
- **Honest uncertainty.** "We're confident in the direction, less so in the magnitude" builds more trust than false precision.

### The discipline
For every chart, ask: *so what?* If there's no answer, cut it. A tight five-slide story outperforms a forty-slide data dump every time.

> Analysts are hired to find answers but promoted for making people *care* about them. Storytelling is the multiplier on every technical skill in this book.`},

{q:"What are the most common data visualization mistakes?",level:"Foundational",tags:["Design","Pitfalls"],a:
`### Distortion sins (the dishonest ones)
- **Truncated axes** — starting a bar chart at 90 makes a 3% difference look like a collapse
- **Dual y-axes** — implying relationships by independently rescaling two lines; almost always misleading
- **3D effects** — perspective systematically distorts values
- **Cherry-picked time ranges** — starting the trend right after a peak

### Clutter sins
- **Rainbow palettes** — ten colors means no emphasis; highlight the one series that matters, grey the rest
- **Chartjunk** — heavy gridlines, borders, shadows, background images
- **Pie charts with 12 slices** — use a bar chart
- **Overloaded dashboards** — 20 visuals = 0 messages

### Communication sins
- Missing units, sources, or time frames
- No context: a number without a target or prior period
- Color-only encoding (fails for colorblind viewers and grayscale printing)
- Inconsistent scales across small multiples meant to be compared

### The underlying principle
Every design choice either serves the message or serves the designer's ego. Audit ruthlessly for the former.

> A memorable line for interviews: "The goal isn't to make data look impressive — it's to make the truth impossible to miss."`},

{q:"What is DAX, and can you give examples of measures you'd write?",level:"Advanced",tags:["Power BI","DAX"],a:
`DAX (Data Analysis Expressions) is the formula language of Power BI, Power Pivot, and Analysis Services. It looks like Excel formulas but operates on **tables and columns** with a crucial concept: **filter context** — the set of active filters (slicers, rows, columns) under which a measure evaluates.

### Measures vs calculated columns
- **Calculated column** — computed row-by-row at refresh, stored in the model
- **Measure** — computed at query time against the current filter context; the right choice for aggregations

~~~excel
Total Revenue = SUM(Sales[Amount])

Revenue YTD = TOTALYTD([Total Revenue], 'Date'[Date])

Revenue LY = CALCULATE([Total Revenue], SAMEPERIODLASTYEAR('Date'[Date]))

YoY Growth % = DIVIDE([Total Revenue] - [Revenue LY], [Revenue LY])

East Share % = DIVIDE([Total Revenue],
                      CALCULATE([Total Revenue], ALL(Region)))
~~~

### CALCULATE — the heart of DAX
{{CALCULATE}} modifies the filter context: {{ALL}} removes filters (for "% of total"), {{FILTER}} adds them, time-intelligence functions shift them. Understanding that measures *recompute per visual cell* under different filter contexts is the conceptual leap.

> If DAX comes up, say the words "filter context" early and correctly — it's the litmus test interviewers use to separate real Power BI users from résumé padders.`},

{q:"Explain drill-down, drill-through, slicers, and filters in BI tools.",level:"Intermediate",tags:["Power BI","Tableau"],a:
`These four mechanisms make reports interactive — each serves a different exploration pattern.

### Drill-down
Move **down a hierarchy** within the same visual: Year → Quarter → Month → Day, or Country → State → City. Built from hierarchical fields; the user clicks to descend and back up.

### Drill-through
Jump to a **separate detail page** carrying the current context. Right-click "East region" on a summary page → land on a page showing East's products, reps, and transactions, pre-filtered. Summary stays clean; detail is one click away.

### Slicers
**On-canvas filter controls** — buttons, dropdowns, date sliders — visible and friendly for end users. They can be scoped to affect one visual, one page, or synced across pages.

### Filters (filter pane)
The **behind-the-scenes layer**: visual-level, page-level, and report-level filters. Used by the report author for structural filtering ("only completed orders") rather than interactive exploration.

### Worth adding
- **Cross-filtering/highlighting:** clicking a bar filters other visuals — the default BI superpower
- **Row-level security:** filters applied by user identity, so one report serves many audiences safely

> Design guidance that impresses: slicers for the 2–3 dimensions users always ask about; drill-through for everything else. Don't turn the canvas into a control panel.`},

{q:"How should color be used in data visualization?",level:"Intermediate",tags:["Design","Color"],a:
`Color is the most powerful — and most abused — visual channel.

### The core principles
- **Restraint:** one accent color for the series that matters; greys for context. If everything is colorful, nothing stands out.
- **Semantic consistency:** the same category keeps the same color across every chart in a report. Red/green carry meaning (bad/good) — use deliberately, and never as the only signal.
- **Match palette to data type:**
  - *Sequential* (light → dark) for ordered magnitude (low → high revenue)
  - *Diverging* (e.g., blue ↔ red around a neutral midpoint) for values with a meaningful center (profit/loss, vs target)
  - *Categorical* (distinct hues) for unordered groups — max ~6 before it becomes noise

### Accessibility
~8% of men have color-vision deficiency. Use colorblind-safe palettes (blue/orange survives most), sufficient contrast, and redundant encoding (labels, icons, patterns) so meaning never rides on hue alone.

### Emphasis as narrative
A powerful technique: render all regions grey except the one you're discussing. The chart itself directs attention — color as a storytelling device, not decoration.

> Naming sequential vs diverging vs categorical palettes — and when each applies — is a detail that instantly marks you as design-literate.`},

{q:"How do you present analytical findings to executives?",level:"Intermediate",tags:["Communication","Stakeholders"],a:
`Executives buy clarity and confidence, not methodology. My approach:

### 1. BLUF — Bottom Line Up Front
Open with the conclusion and recommendation: "Churn is up 2 points, driven by the annual-plan cohort; here's the fix and its projected impact." Evidence follows for those who want it.

### 2. Translate to business language
Replace "the logistic model's AUC was 0.81" with "we can now flag three-quarters of at-risk customers a month early." Revenue, cost, risk, time — their currencies.

### 3. One message per slide, headline as takeaway
Not "Q3 Sales by Region" but "West region grew 18% while Northeast stalled." The headline *is* the insight; the chart is the proof.

### 4. Calibrated confidence
State what you know, what you assume, and what you'd check with more time. "Direction is solid; magnitude is ±20%" is more credible than false precision — and executives remember analysts who were honest about uncertainty.

### 5. Anticipate the three questions
Why did this happen? What should we do? What happens if we don't? Have answers — and an appendix with the technical depth for the one person who always asks.

### 6. End with the ask
A decision, a resource, a next step. Analysis without an ask is entertainment.

> The mindset shift: you're not presenting your work; you're enabling a decision. Everything that doesn't serve the decision is appendix material.`}
]},

num:6, title:"Data Cleaning & Preparation", short:"Data Cleaning",
intro:"Ask any working analyst where the hours go and the answer is unanimous: cleaning and preparing data. Interviewers probe this area because it reveals whether you'll be trustworthy with real, messy, production data — or whether you'll build beautiful analyses on rotten foundations. These eight questions cover the discipline of data quality.",
covers:["A repeatable cleaning workflow","Missing data & outlier strategy","Deduplication & validation","Documentation that builds trust"],
qa:[
{q:"Walk me through your data cleaning process from raw data to analysis-ready.",level:"Intermediate",tags:["Workflow","Process"],a:
`I follow a repeatable sequence — ad-hoc cleaning is how errors sneak in.

### 1. Understand before touching
Where does the data come from? What does one row represent (the **grain**)? How was it collected? Cleaning without context destroys information.

### 2. Profile
Row counts, dtypes, null rates, unique counts, min/max, distributions. This is the diagnostic scan — it tells you where the bodies are buried.

### 3. Define rules
What does "clean" mean for *this* analysis? Valid ranges, required fields, acceptable categories. Write them down — they become your validation tests later.

### 4. Clean systematically
- Fix dtypes (dates, numbers-as-text)
- Standardize categories ('NY', 'New York', 'new york' → one value)
- Handle missing values per their mechanism
- Resolve duplicates with an explicit survivorship rule
- Address outliers — investigate first, treat second

### 5. Validate
Row counts reconcile with the source, totals match known figures, business rules hold (no ship date before order date).

### 6. Document
Every transformation logged, ideally in code so it's reproducible. Future-you — and your reviewers — will be grateful.

> The key phrase: "cleaning is iterative and documented, never silent." An analyst who can't explain exactly how the data changed is a liability.`},

{q:"What strategies do you use for missing data, and how do you choose?",level:"Intermediate",tags:["Missing Data"],a:
`The right strategy depends on **why** the data is missing — the mechanism matters more than the volume.

### The three mechanisms
- **MCAR** (missing completely at random) — a system glitch scattered gaps randomly. Safe to drop or impute simply.
- **MAR** (missing at random) — missingness relates to *observed* variables (mobile users less often complete the survey). Impute using related columns.
- **MNAR** (missing not at random) — missingness relates to the value itself (high earners skip the income question). Most dangerous; the gap is informative.

### The toolkit
- **Drop rows** — only when missingness is small and MCAR
- **Drop the column** — if it's mostly empty and low-value
- **Impute:** mean/median (numeric), mode or 'Unknown' (categorical), forward-fill/interpolation (time series), model-based imputation (predict from other features)
- **Keep as a signal:** add a {{was_missing}} indicator — missingness itself often predicts outcomes

### The rules I never break
- Never silently impute — document method and rationale
- Never impute before checking whether missingness correlates with your outcome
- Sanity-check distributions before and after imputation

> Saying "I'd first ask whether the missingness itself means something" is the single highest-value sentence for this question.`},

{q:"How do you decide whether an outlier should be kept, transformed, or removed?",level:"Intermediate",tags:["Outliers","Judgment"],a:
`Outliers demand a diagnosis before a decision. I sort them into three buckets:

### 1. Errors — fix or remove
Impossible values (age 240, negative prices), unit mismatches (seconds vs milliseconds), test accounts, bot traffic. Verify against the source system when possible, correct what's correctable, remove what's not — and log every removal.

### 2. Genuine extremes — usually keep
Whale customers, viral days, Black Friday. These are often the **most important rows in the dataset** — removing them sanitizes away the business reality. Instead:
- Report medians alongside means
- Analyze with and without, and show both
- Segment them (enterprise vs self-serve) rather than delete

### 3. Ambiguous — contain the influence
- **Winsorize/cap** at the 1st/99th percentile
- **Transform** (log) to compress the tail
- Use **robust methods** (median, IQR-based stats) that resist extreme values

### The decision test
Ask: "Is this value possible in the real world, and is it part of the population I'm analyzing?" Possible + in-population → keep and handle statistically. Impossible or out-of-population → remove with documentation.

> Deleting outliers to make a chart prettier or a model cleaner is analytical malpractice. The outlier is often the story — fraud, your best customer, or a broken sensor telling you something.`},

{q:"What data type and formatting problems do you encounter most, and how do you fix them?",level:"Foundational",tags:["Data Quality","Cleaning"],a:
`The usual suspects, learned through scars:

### Numbers stored as text
'1,234.56' or '$99.00' won't sum. Strip symbols and separators, then cast. Watch for European formats where comma and period swap roles ('1.234,56').

### Dates in chaos
'01/02/2024' — January 2nd or February 1st? Mixed formats in one column, Excel serial numbers, Unix timestamps, timezone-naive datetimes. Fix: parse explicitly with known formats, standardize to ISO 8601, and always clarify timezone handling.

### Leading zeros destroyed
ZIP codes, product SKUs, and account IDs lose leading zeros when opened as numbers ('02134' → 2134). Import these as **text** — always.

### Categorical fragmentation
'NY', 'N.Y.', 'New York', 'new york' — one entity, four values. Standardize case, trim whitespace, map to a canonical list.

### Boolean anarchy
TRUE/FALSE, 1/0, Y/N, yes/Yes/YES in one column. Map everything to one convention.

### Encoding gremlins
'café' becoming 'cafÃ©' — UTF-8 read as Latin-1. Specify encoding explicitly on import.

> The meta-skill: **validate at the boundaries**. Check dtypes immediately after every import and every join — type bugs compound silently downstream.`},

{q:"How do you approach deduplication when records aren't exactly identical?",level:"Advanced",tags:["Deduplication","Entity Resolution"],a:
`Exact dedup is easy; the real world gives you 'Jonathan Smith at Acme Inc.' and 'Jon Smyth at ACME Incorporated' — same person, different strings.

### Step 1: Standardize everything first
Lowercase, trim, normalize punctuation, expand abbreviations (Inc. → Incorporated), standardize phone/address formats. Half of "fuzzy" duplicates evaporate here.

### Step 2: Define match keys
- **Deterministic:** exact match on a strong key (email, phone, tax ID)
- **Probabilistic/fuzzy:** similarity scores on names (edit distance, Jaro-Winkler), addresses, and combinations — tools like {{rapidfuzz}} or record-linkage libraries

### Step 3: Set thresholds and review
Fuzzy matching trades precision against recall. A 95% similarity threshold catches more dupes but risks merging different people ('John Smith' is a crowded name). High-stakes merges deserve human review queues.

### Step 4: Survivorship rules
When duplicates merge, which values win? Common rules: most recently updated, most complete record, or field-level rules (newest phone, oldest signup date). **Write the rules down** — they're business decisions, not technical ones.

### Step 5: Verify
Sample merged and unmerged records; measure match rates; reconcile counts with stakeholders before deleting anything.

> The phrase "entity resolution" plus a survivorship-rule discussion marks you as someone who has done this for real.`},

{q:"People say 80% of analytics is data cleaning. Do you agree, and how do you manage that reality?",level:"Foundational",tags:["Mindset","Process"],a:
`The number is folklore, but the sentiment is accurate — in my experience 50–70% of project time goes to acquiring, cleaning, and validating data before any "analysis" happens.

### Why it's true
- Real data is created by humans, legacy systems, and third parties — all messy
- Every new source has undocumented quirks
- Business definitions hide in the data ('active' means what, exactly?)
- The cost of dirty data compounds: one bad join invalidates everything downstream

### How I manage it — rather than suffer it
1. **Push quality upstream.** Validation at data entry, schema contracts with engineering, and feedback loops to source systems. The cheapest cleaning is the cleaning you never need.
2. **Automate the repeatable.** First-time cleaning is exploration; second-time is a script; third-time is a pipeline. Never clean the same file manually twice.
3. **Set expectations honestly.** Stakeholders see the dashboard, not the plumbing. I communicate that trustworthy numbers take time — and what breaks when we skip it.
4. **Clean to the question.** A quick directional estimate needs less rigor than a board-level metric. Match effort to stakes.

### The reframe
Cleaning isn't the tax before the real work — much of the *insight* lives in the cleaning: discovering the duplicate accounts, the mislabeled region, the tracking gap. That's analysis too.

> This answer balances realism with professionalism — exactly what the interviewer is checking for.`},

{q:"How do you validate that a dataset is accurate and complete before analyzing it?",level:"Intermediate",tags:["Validation","Data Quality"],a:
`I validate against the six dimensions of data quality, with concrete checks for each.

### The dimensions and their checks
- **Completeness** — null rates per column; row counts vs expectations; missing dates in a time series (build a calendar spine and look for gaps)
- **Uniqueness** — duplicate rates on keys that should be unique
- **Validity** — values within legal ranges and formats (emails match a pattern, dates not in the future, statuses from the allowed list)
- **Consistency** — cross-field logic (ship date ≥ order date; age matches birthdate); same entity named identically across tables
- **Accuracy** — reconcile to a trusted source: does total revenue match finance's number? Do user counts match the auth system? **Reconciliation is the strongest validation there is.**
- **Timeliness** — is the data fresh enough for this decision? When was it last updated?

### Make it systematic
~~~python
# Example: lightweight assertion-style checks
assert df['order_id'].is_unique
assert df['amount'].between(0, 1_000_000).all()
assert df['order_date'].max() >= pd.Timestamp.today() - pd.Timedelta('2D')
~~~

In mature teams these become automated **data tests** (dbt tests, Great Expectations) that run on every pipeline load.

> The punchline: "I never trust a dataset I haven't reconciled against an independent source." That one habit prevents most analytical disasters.`},

{q:"How do you document your data work so others can trust and reproduce it?",level:"Intermediate",tags:["Documentation","Reproducibility"],a:
`Documentation is what turns a one-off analysis into an organizational asset.

### The layers I maintain
- **Data dictionary** — every field: name, definition, type, source, allowed values, and the *business meaning* ('revenue' = net of refunds, recognized at ship date)
- **Assumptions log** — every judgment call: how duplicates were resolved, why outliers were capped, which timezone was used. Assumptions are where analyses die in review.
- **Lineage** — where the data came from, what transformations it passed through, where the output lands. "This dashboard reads from table X, built by script Y, refreshed daily at 6 AM."
- **Reproducible code** — version-controlled scripts/notebooks that regenerate results from raw inputs. If it can't be rerun, it isn't done.
- **README per project** — question, approach, data sources, how to run, key caveats

### Why it matters beyond politeness
- **Trust:** stakeholders accept numbers they can trace
- **Handover:** analysts change teams; undocumented work dies with them
- **Review:** your future self, six months on, is effectively a different person — document for them
- **Compliance:** in regulated spaces, lineage isn't optional

> The crisp framing: "Code shows *what* you did; documentation shows *why* — and the why is what people actually challenge in meetings."`}
]},
