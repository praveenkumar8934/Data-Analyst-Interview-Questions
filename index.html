num:7, title:"Business Acumen & Case Studies", short:"Case Studies",
intro:"Case questions are where interviews are won. There is no single correct answer — interviewers are scoring your structure, your hypotheses, and whether you think like a business partner rather than a query machine. This chapter provides frameworks and worked examples for the ten case patterns that appear most often in data analyst interviews.",
covers:["Metric-drop investigations","Funnel, cohort & churn analysis","Experiment readouts & guesstimates","Metric selection & prioritization"],
qa:[
{q:"Revenue dropped 20% week-over-week. Walk me through your investigation.",level:"Advanced",tags:["Case Study","Frameworks"],a:
`This is the classic case question. Structure is everything — I'd work outside-in.

### Step 1: Verify the data itself
Before hunting business causes: is the drop real? Check for tracking bugs, pipeline failures, timezone changes, delayed data loads, or a dashboard definition change. A shocking share of "metric drops" are instrumentation issues.

### Step 2: Isolate the where
Decompose the drop along every dimension:
- **Segment:** new vs returning users? Which plans, regions, devices, channels?
- **Funnel stage:** did traffic fall, or conversion, or order value?
- **Time:** sudden cliff (suggests an event) or gradual slide (suggests trend)?

If revenue = traffic × conversion × AOV, which factor moved?

### Step 3: Generate hypotheses
- **Internal:** a release that broke checkout, a price change, a paused marketing campaign, a stockout
- **External:** seasonality, holiday calendar shifts, competitor promotion, market events
- **Mix effects:** traffic shifted toward lower-value segments (revenue per visitor unchanged, but mix changed)

### Step 4: Test and quantify
Check release calendars, campaign dashboards, year-over-year comparisons. Size each contributing factor.

### Step 5: Communicate and recommend
"60% of the drop is iOS traffic after Tuesday's app release; here's the fix and expected recovery." Then add monitoring so it's caught in hours, not weeks.

> The framework to state aloud: **verify → isolate → hypothesize → test → act**. Calm structure under ambiguity is the entire point of this question.`},

{q:"How would you design a dashboard for an e-commerce company?",level:"Intermediate",tags:["Case Study","Dashboards"],a:
`I'd start with users and decisions, not charts.

### Step 1: Clarify
Who is this for — the CEO (weekly health check), the growth team (daily optimization), or ops (hourly firefighting)? Each needs different granularity, freshness, and metrics. What decisions should it drive?

### Step 2: Structure around the customer journey
- **Acquisition:** sessions, traffic by channel, CAC
- **Conversion:** funnel rates (visit → product view → cart → checkout → purchase), cart abandonment
- **Value:** revenue, AOV, units per transaction, margin
- **Retention:** repeat purchase rate, cohort retention, CLV
- **Health guardrails:** refund rate, stockouts, site errors

### Step 3: Design the layout
Top row: 4–5 headline KPIs with vs-target and vs-last-period context. Middle: trends over time. Bottom: breakdowns by channel/category/region with drill-through to detail. Filters for date range and segment.

### Step 4: Operational details
Refresh cadence matched to decisions (daily for most), alerts on threshold breaches, mobile-friendly summary view, and documented metric definitions.

### Step 5: Iterate
Ship v1 to a small group, watch usage, cut what they ignore.

> Naming the funnel structure *and* the audience-first approach covers both the business and design dimensions interviewers probe.`},

{q:"Estimate how many pizzas are delivered daily in New York City.",level:"Intermediate",tags:["Guesstimate","Estimation"],a:
`Guesstimates test **structured decomposition**, not trivia. I'd think out loud and round aggressively.

### Step 1: Clarify and bound
Delivered pizzas only (not dine-in), daily average, NYC's ~8.3 million residents.

### Step 2: Decompose demand
- ~8.3M people ÷ ~2.5 per household ≈ **3.3M households**
- Assume a household orders delivery pizza roughly **once a month** on average (some weekly, many never — averages out plausibly)
- 3.3M orders/month ÷ 30 days ≈ **110,000 household orders/day**
- Average **1.5 pizzas per order** → ~165,000 pizzas

### Step 3: Add non-household demand
Offices, events, dorms — estimate +20% → **~200,000 pizzas/day**

### Step 4: Sanity-check from the supply side
- NYC has roughly 1,500–2,000 pizzerias plus chains
- 200,000 ÷ 1,800 ≈ **110 delivered pizzas per shop per day** — plausible for delivery-heavy shops across lunch and dinner

Both directions land in the same zone → confidence in the estimate.

### What the interviewer is scoring
Clear structure, explicit assumptions, comfortable arithmetic, and the sanity check. The number itself barely matters.

> Always close with the supply-side cross-check — triangulating from two directions is what separates a guess from an estimate.`},

{q:"Which metrics would you track for a subscription business, and why?",level:"Intermediate",tags:["Metrics","SaaS"],a:
`Subscription economics revolve around recurring revenue and retention.

### Revenue metrics
- **MRR / ARR** — monthly/annual recurring revenue; the pulse of the business
- **MRR movement** — new + expansion − contraction − churned MRR. The bridge tells you *where* growth comes from

### Retention metrics
- **Logo churn** — % of customers lost per period
- **Revenue churn / NRR** — net revenue retention = (starting MRR + expansion − contraction − churn) / starting MRR. **NRR > 100% means the existing base grows by itself** — the hallmark of great subscription businesses
- **Cohort retention curves** — do newer cohorts retain better?

### Unit economics
- **CAC** — cost to acquire a customer
- **LTV** — lifetime value ≈ ARPU × gross margin ÷ churn rate
- **LTV:CAC ratio** — >3 is the classic healthy bar
- **CAC payback** — months to recover acquisition cost; cash-flow critical

### Leading indicators
- **Activation rate** — new users reaching the "aha" moment
- **Engagement/usage frequency** — declining usage precedes churn by weeks

### The narrative
These metrics chain together: engagement predicts churn, churn drives LTV, LTV bounds CAC, and CAC payback governs how fast you can grow.

> Volunteering the LTV ≈ ARPU × margin ÷ churn relationship — and its sensitivity to churn — demonstrates genuine command of the model.`},

{q:"An A/B test shows variant B winning with p = 0.049. Do you ship it?",level:"Advanced",tags:["Case Study","Experimentation"],a:
`Not on that evidence alone. p = 0.049 is a *procedural* pass but demands scrutiny before a business decision.

### What I'd check first
1. **Was the test adequately powered and run to plan?** If we peeked repeatedly and stopped the moment p dipped below 0.05, that p-value is meaningless — sequential peeking inflates false positives dramatically.
2. **Duration:** did it cover full business cycles (at least 1–2 weeks)? A test ending mid-week skews behavior.
3. **Sample ratio and randomization:** any imbalance or contamination between groups?
4. **Effect size and practical significance:** a 0.1% relative lift with p = 0.049 may be statistically real and commercially irrelevant — what's the cost of shipping and maintaining the change?
5. **Guardrail metrics:** did retention, revenue, or latency quietly degrade?
6. **Multiple comparisons:** if we tested 20 variants, one p < 0.05 is expected by pure chance — apply corrections.
7. **Segment effects:** does the win hold across major segments, or is one group carrying it (Simpson's paradox risk)?

### The decision
If the test was pre-registered, adequately powered, clean on guardrails, and the lift is practically meaningful → ship, and monitor post-launch. If any of those fail → extend the test, rerun, or abandon.

> The mature framing: "p-values inform decisions; they don't make them." That sentence alone often passes this question.`},

{q:"How would you analyze customer churn for a subscription product?",level:"Advanced",tags:["Case Study","Churn"],a:
`### Step 1: Define churn precisely
Canceled subscription? Payment failure (involuntary churn — often 20–40% of the total)? Inactivity threshold? The definition changes everything downstream.

### Step 2: Measure it correctly
- **Logo churn** and **revenue churn** (losing ten tiny accounts ≠ losing one enterprise)
- **Cohort analysis** — retention curves by signup month reveal whether churn is improving and *when* in the lifecycle customers leave (month-1 onboarding failures vs month-13 value erosion)

### Step 3: Segment for the where
Plan tier, acquisition channel, geography, use case, company size. Churn is rarely uniform — one segment usually bleeds while others are healthy.

### Step 4: Find leading indicators
Correlate pre-churn behavior: login frequency drops, key feature abandonment, support ticket spikes, failed payments. These become an **early-warning score** and, more importantly, hypotheses about *why*.

### Step 5: Understand the why
Exit surveys, cancellation-flow reasons, win-back interviews. Quantitative data shows where; qualitative data explains why.

### Step 6: Quantify and act
Size each driver by revenue impact, recommend interventions (onboarding fixes, dunning flows for involuntary churn, save offers), and define how we'll measure whether they worked.

> Distinguishing voluntary vs involuntary churn — and noting they need entirely different fixes — is the detail that signals real subscription experience.`},

{q:"Explain funnel analysis with a concrete example.",level:"Intermediate",tags:["Funnel","Product Analytics"],a:
`Funnel analysis tracks users through a **sequence of steps toward a goal**, measuring conversion and drop-off at each stage. It turns "conversion is low" into "conversion breaks *here*."

### E-commerce example
| Step | Users | Step conversion |
| Product view | 100,000 | — |
| Add to cart | 12,000 | 12% |
| Begin checkout | 6,000 | 50% |
| Purchase | 4,200 | 70% |

Overall conversion: 4.2%. The **biggest absolute leak** is view → cart (88,000 users); the **biggest relative leak** is also there (12%).

### How to act on it
- **View → cart weak:** product pages, pricing display, imagery, reviews, stock availability
- **Cart → checkout weak:** unexpected shipping costs, forced account creation
- **Checkout → purchase weak:** payment failures, limited payment options, trust signals

### Analysis refinements that impress
- **Segment the funnel** — mobile vs desktop often tells completely different stories
- **Time-to-convert** — how long between steps? Long gaps suggest hesitation points
- **Funnel windows** — must steps complete in one session, or within 7 days? Definition changes numbers
- **Watch the denominators** — marketing can "improve" conversion by sending worse traffic that never enters the funnel

> The core value: funnels convert vague anxiety into a ranked list of specific, fixable problems. That's the sentence to land.`},

{q:"What is cohort analysis, and what can it reveal that aggregates hide?",level:"Intermediate",tags:["Cohorts","Retention"],a:
`A cohort is a group of users sharing a **start point** — usually signup week or month. Cohort analysis tracks each group's behavior over time, typically as a retention table or heatmap.

### The classic view
Rows = signup month; columns = months since signup; cells = % still active.

| Cohort | M0 | M1 | M2 | M3 |
| Jan | 100% | 45% | 32% | 27% |
| Feb | 100% | 52% | 38% | 33% |
| Mar | 100% | 58% | 44% | — |

### What it reveals that averages conceal
- **Is the product actually improving?** Aggregate retention can look flat while every *new* cohort retains better — masked by the growing weight of old cohorts. Here, Feb beats Jan, Mar beats Feb: onboarding changes are working.
- **When users leave:** a steep M0→M1 drop signals onboarding failure; a slow bleed signals weak long-term value.
- **Seasonality and acquisition quality:** December cohorts (holiday signups) often behave worse — aggregates blame the product.
- **The long-run plateau:** where curves flatten tells you your durable retention floor — the foundation of LTV.

### Beyond signup cohorts
Cohort by acquisition channel, plan, geography, or first-purchase product — any shared start that might shape behavior.

> The key insight to voice: "Aggregates mix populations; cohorts keep them separate. Most 'mysterious' metric movements are mix shifts that cohorts expose immediately."`},

{q:"What is a North Star metric, and how would you choose one?",level:"Intermediate",tags:["Metrics","Strategy"],a:
`A North Star metric is the **single metric that best captures the core value your product delivers to customers** — the one number that, if it grows sustainably, means the business is healthy.

### Canonical examples
- Spotify: time spent listening
- Airbnb: nights booked
- Facebook (early): daily active users
- Slack: messages sent within teams

Notice each measures *customer value received*, not company value extracted. Revenue follows value; it rarely leads it.

### Criteria for a good North Star
- **Reflects customer value** — users getting the thing they came for
- **Leading indicator of revenue** — predicts business results
- **Actionable by teams** — product, marketing, and support can all influence it
- **Simple to understand** — everyone in the company can state it
- **Hard to game** — a metric that can be inflated without creating value will be

### The supporting cast
A North Star alone is too blunt to operate. It decomposes into **input metrics**: DAU = new user activation + retained users + resurrected users. Teams own the inputs; the company watches the star.

### Cautions
One metric never tells the whole story — pair it with guardrails (quality, margin, satisfaction) so optimizing the star doesn't burn the village.

> Being able to propose a North Star for *the company you're interviewing with* — with reasoning — is one of the highest-impact moves in any analytics interview.`},

{q:"You receive more analysis requests than you can handle. How do you prioritize?",level:"Intermediate",tags:["Prioritization","Stakeholders"],a:
`An un-prioritized analyst becomes a ticket queue; a prioritized one becomes a partner. My framework:

### 1. Clarify the decision behind every request
"What decision will this analysis inform?" Half of all requests evaporate or shrink here — the real need is often one number, not a two-week study. If no decision depends on it, it's curiosity, and it waits.

### 2. Score on three axes
- **Impact** — revenue at stake, strategic importance, audience (board vs blog post)
- **Urgency** — is there a real deadline (launch, quarter-end) or a manufactured one?
- **Effort** — hours vs weeks; quick wins that unblock decisions jump the queue

### 3. Align with goals
Work tied to active company objectives outranks everything else. When priorities conflict between stakeholders, I escalate the trade-off to leadership rather than silently choosing — resource allocation is their call, made visible by me.

### 4. Communicate transparently
A visible queue with ETAs: "I can start Thursday, deliver Tuesday." People accept 'not now' far better than silence. For small asks, I often teach self-serve (a saved query, a dashboard) — the highest-leverage move of all.

### 5. Protect deep work
Batch ad-hoc requests into office hours or set days; constant context-switching destroys the quality of everything.

> The line that lands: "I don't say no — I say 'here's what it would displace; help me choose.' That turns prioritization into a shared decision."`}
]},

{
num:8, title:"Behavioral & HR Mastery", short:"Behavioral",
intro:"Technical skills get you the interview; behavioral answers get you the offer. These questions assess ownership, communication, resilience, and self-awareness — and they are scored more rigorously than most candidates realize. Each answer here includes a framework and a model response you can adapt with your own stories.",
covers:["STAR method mastery","Conflict, failure & ambiguity stories","Stakeholder communication","Questions that impress interviewers"],
qa:[
{q:"Tell me about yourself.",level:"Foundational",tags:["Behavioral","Opening"],a:
`This opener sets the frame for the entire interview. Use the **Present → Past → Future** arc in 60–90 seconds.

### The structure
- **Present:** your current role and one signature strength
- **Past:** the experience that built relevant skills, with one quantified win
- **Future:** why this role is the logical next step

### Model answer
"I'm currently a data analyst at a mid-size e-commerce company, where I own our marketing analytics — everything from campaign attribution to the weekly executive dashboard. I got here through a slightly unusual path: I started in operations, where I kept building spreadsheets to answer my own questions, until the company created an analyst role for me. In the last year I automated our reporting pipeline in Python, which saved the team about 15 hours a week and — more importantly — got us from monthly to daily decision-making. What excites me about this role is the scale of your data and the chance to work on experimentation, which is where I want to deepen my craft."

### Rules
- Tailor the "future" segment to *this* company's job description
- One number beats five adjectives
- Never recite your résumé chronologically — curate, don't list
- Practice until it sounds unpracticed

> The interviewer is quietly deciding in these 90 seconds whether the rest of the interview is a formality. Treat it as the highest-leverage answer you'll give.`},

{q:"Why do you want to be a data analyst?",level:"Foundational",tags:["Behavioral","Motivation"],a:
`Interviewers are screening for genuine motivation versus "I heard it pays well." The strongest answers connect a personal trait to the daily reality of the job.

### The formula
**Authentic spark → evidence you've pursued it → why this role satisfies it**

### Model answer
"I've always been the person who needs to know *why*. In my first job in customer support, I noticed the same complaint recurring and pulled the ticket data myself — it turned out one product flaw caused 30% of our volume. Fixing it cut tickets measurably, and I was hooked: a question, some data, and a real change at the end. Since then I've deliberately built the toolkit — SQL, Python, statistics — through courses and freelance projects. What draws me to analytics specifically over other technical paths is that it sits at the intersection of rigor and communication: the answer only matters if you can make someone act on it. That translation work is the part I enjoy most."

### Avoid
- Generic praise ("data is the new oil")
- Framing it as a stepping stone ("eventually I want to be a data scientist") — it signals you'll disengage
- Money or job-market reasoning

> Notice the model answer contains a mini-story with a number. Motivation backed by evidence is credible; motivation backed by adjectives is not.`},

{q:"Describe a challenging analytics project you worked on.",level:"Intermediate",tags:["Behavioral","STAR"],a:
`Use **STAR**: Situation, Task, Action, Result — with most of your time on Action.

### Model answer
"**Situation:** Our leadership wanted to know why cart abandonment spiked 15% after a checkout redesign. **Task:** I had two weeks to diagnose it, but the event tracking from the new checkout was inconsistent — some steps fired twice, others not at all.

**Action:** First, I rebuilt a reliable funnel by reconstructing sessions server-side rather than trusting the broken client events. I segmented the funnel by device and found the drop was almost entirely mobile Safari. Session recordings suggested the payment form was the culprit, so I worked with engineering to instrument field-level events and confirmed users were failing on address autocomplete. I quantified the revenue impact — about $40k per week — which got the fix prioritized immediately.

**Result:** After the fix, mobile conversion recovered within a week and ended 3% *above* the pre-redesign baseline. More lastingly, I proposed a tracking-validation checklist that became standard for every release."

### Why this works
- Real obstacle (broken data), not fake adversity
- Shows debugging, cross-functional work, and business framing
- Ends with systemic impact, not just a fixed bug

> Prepare three STAR stories — a technical challenge, a stakeholder challenge, and a failure — and you can answer 80% of behavioral questions by remixing them.`},

{q:"Tell me about a time you disagreed with a stakeholder about an analysis.",level:"Intermediate",tags:["Behavioral","Conflict"],a:
`This tests diplomacy under pressure. The winning arc: **understand their view → let data arbitrate → preserve the relationship**.

### Model answer
"**Situation:** A marketing director wanted to credit a campaign for a 20% lift in signups and asked me to 'confirm' it in the analysis. **Task:** My initial look suggested the lift was mostly seasonal — but she was senior, confident, and had budget riding on the conclusion.

**Action:** Instead of leading with contradiction, I asked her to walk me through why she believed the campaign drove it — partly to check for context I lacked, partly to show respect. Then I proposed we test both hypotheses together: I compared year-over-year seasonality, ran a matched-market analysis against regions where the campaign didn't run, and walked her through both views side by side. The data showed the campaign contributed roughly a third of the lift — real, but smaller than claimed.

**Result:** She appreciated being shown rather than told, and we co-presented the nuanced version: the campaign worked, and here's its true effect size. She became one of my strongest advocates, and 'show me the matched markets' became her own catchphrase."

### The principles to name
- Disagree with the analysis, never the person
- Bring alternatives, not just objections
- Partial credit defuses: "you were partly right" lands better than "you were wrong"

> Never pick a story where you "won" by proving someone stupid. Interviewers hire the diplomat, not the victor.`},

{q:"Describe a time you delivered analysis under a tight deadline.",level:"Foundational",tags:["Behavioral","Pressure"],a:
`They're testing prioritization, communication, and judgment about trade-offs — not heroics.

### Model answer
"**Situation:** On a Tuesday afternoon, our CEO requested a full churn analysis for a Thursday board meeting — a project that would normally take a week. **Task:** Deliver something decision-ready in 36 hours without compromising accuracy.

**Action:** I immediately scoped with the CEO's chief of staff: the board needed *direction and magnitude*, not a complete driver breakdown. I cut the project to the three questions that mattered — how much churn, where concentrated, is it accelerating — and reused a validated cohort pipeline rather than building fresh. I flagged two data caveats I couldn't resolve in time and stated them explicitly on the slide rather than hiding them. I also sent a preview Wednesday night so there'd be no surprises.

**Result:** The analysis held up in the board meeting, the retention initiative it supported was approved, and my note about the caveats built enough trust that I was asked to lead the follow-up deep-dive — with a proper two-week timeline."

### The transferable principles
- Scope to the decision, not to perfection
- Communicate constraints and caveats proactively
- Preview early; no surprises at the deadline

> The counterintuitive insight to voice: under deadline pressure, *communication quality matters more than analytical depth*. Stakeholders forgive limits; they don't forgive surprises.`},

{q:"How do you explain technical findings to non-technical stakeholders?",level:"Intermediate",tags:["Behavioral","Communication"],a:
`This is arguably *the* core analyst skill, and they want both philosophy and proof.

### My principles
1. **Start with the answer, not the method.** Nobody's first question is "which algorithm?" — it's "what should we do?"
2. **Translate to their units.** Revenue, customers, risk, hours. Statistical vocabulary stays in the appendix.
3. **Use analogies for mechanism.** "A confidence interval is like a fishing net — wider nets catch the true value more often, but tell you less about where it is."
4. **Show, don't describe.** One clean visual with the key number annotated beats a table of coefficients.
5. **Calibrate honesty.** State confidence and caveats in plain language: "We're confident in the direction, less sure of the exact size."

### A quick story to include
"I once presented a churn model to our sales leadership. My first draft led with model performance metrics — and I watched eyes glaze over in the dry run. I rebuilt it around three slides: 'We can now flag at-risk customers 60 days early,' 'Here's how we know it works — it caught 8 of the last 10 churners in backtesting,' and 'Here's what we do Monday morning.' Same analysis, completely different reception — they asked how soon it could go live."

### The test I apply
Could the stakeholder explain my finding to *their* boss in one sentence? If not, I haven't finished.

> Analysts are paid for the translation layer. Anyone can run the query; making a room full of executives *understand and act* is the scarce skill.`},

{q:"Tell me about a mistake you made in an analysis. How did you handle it?",level:"Intermediate",tags:["Behavioral","Failure"],a:
`Everyone has a failure story; the question is whether you own yours. Structure: **real mistake → immediate ownership → fix → systemic prevention**.

### Model answer
"Early in my career I reported that a new feature had lifted retention by 8%. **The mistake:** I had joined the events table incorrectly and double-counted users who appeared in both platforms — the real lift was about 2%.

**How I handled it:** A colleague's question during review made me recheck, and I found the fan-out before the deck went to leadership — but *after* I'd already shared preliminary numbers with my manager. I immediately flagged it, explained exactly where the join went wrong, and sent corrected figures with a clear note on what changed and why.

**What I changed permanently:** I built three habits from that day. First, I check row counts before and after every join — a fan-out is instantly visible. Second, I add a 'validation' section to every analysis with reconciliation checks against known totals. Third, I label early numbers as preliminary until the checks pass. In three years since, no join error has made it past my own review."

### Why this works
- The mistake is real and technical (not "I work too hard")
- Ownership is immediate — no blaming tooling or teammates
- The prevention is *systemic*, not "I tried harder"

> The interviewer is imagining you making a mistake at *their* company. This answer tells them: you'll catch it, own it, and build a guardrail. That's exactly who they want.`},

{q:"Describe a time the data contradicted what leadership believed. What did you do?",level:"Advanced",tags:["Behavioral","Influence"],a:
`This tests courage and tact simultaneously — the rarest combination.

### Model answer
"**Situation:** Our leadership was convinced our premium tier was the growth engine and planned to double investment. **The conflict:** my cohort analysis showed premium customers acquired in the last two quarters retained *worse* than standard-tier customers — the tier's strong aggregate numbers were entirely legacy cohorts.

**Action:** I knew a contrarian deck in a big meeting would trigger defensiveness, so I socialized the finding first: one-on-one with the analytics director, then the product lead, refining the analysis with each challenge. I made the deck impossible to misread — cohort curves, not aggregates — and framed it constructively: not 'premium is failing' but 'recent premium acquisition quality has changed; here's the channel mix shift explaining it.' I also proposed the path forward: fix the acquisition mix before scaling spend.

**Result:** Leadership paused the spend increase, redirected budget to the channels producing durable premium customers, and retention of new premium cohorts recovered over the next two quarters. The bigger win: 'check the cohorts' became a standing question in planning meetings."

### The principles
- Socialize contrarian findings before presenting them publicly
- Attack the interpretation, never the people who held it
- Always pair bad news with a path forward

> Data analysts earn unusual influence precisely by being right *and* bearable when the data is unwelcome. This story proves both.`},

{q:"Tell me about a time you had to work with ambiguous requirements or messy data.",level:"Intermediate",tags:["Behavioral","Ambiguity"],a:
`Ambiguity is the default state of analytics work. Show that you create clarity rather than wait for it.

### Model answer
"**Situation:** A VP asked me to 'figure out if the loyalty program is working' — no definition of 'working,' and the program data lived across three systems with inconsistent customer IDs. **Task:** turn fog into an answer.

**Action:** Before touching data, I scheduled 30 minutes with the VP and asked what decision this informed — budget renewal, it turned out — and what success would look like to her. We agreed on three concrete questions: Do members spend more? Do they retain longer? Is the difference causal or selection? For the data mess, I built an identity-mapping table using email and phone as bridge keys, validated a sample by hand, and documented match-confidence tiers. Since members self-select (engaged customers join), I compared members to a matched group of similar non-members rather than to everyone.

**Result:** The program showed a genuine 12% retention lift for mid-tier customers but nothing for low-tier ones — a nuanced answer that shaped the redesign. The VP later said the clarifying conversation alone was worth the project."

### The principles to name
- Ambiguity is resolved by *questions*, not assumptions
- State assumptions explicitly when you must make them
- Match rigor to the decision at stake

> The line that resonates: "Vague requests aren't obstacles — they're invitations to do the analyst's real job, which is defining the question."`},

{q:"Why do you want to work at this company specifically?",level:"Foundational",tags:["Behavioral","Motivation"],a:
`Generic answers ("great culture, exciting mission") are instant fails. The formula: **specific company insight → personal connection → mutual value**.

### The research checklist (do this before every interview)
- The product: use it if possible; note one thing you'd improve or measure
- The business model: how do they actually make money?
- Recent moves: funding, launches, earnings commentary, leadership changes
- The data angle: what makes their data interesting or hard? (scale, marketplace dynamics, real-time, privacy)
- The team: job description keywords, interviewers' backgrounds, engineering blog

### Model answer (adapt the specifics)
"Three reasons. First, the problem space: a two-sided marketplace is one of the most interesting analytical environments there is — supply and demand dynamics, network effects, matching efficiency. Your marketplace take-rate question is genuinely hard, and hard problems are why I do this work. Second, the trajectory: your expansion into business accounts last year creates exactly the kind of greenfield measurement questions — new funnels, new cohorts, undefined metrics — where I do my best work. Third, the craft: I read your data team's post on rebuilding your experimentation platform, and the rigor there is the culture I want to grow in. I believe I can contribute immediately on funnel and retention analysis, and grow toward the experimentation depth your team is known for."

### The test your answer must pass
Could you say this about five other companies? If yes, rewrite it.

> Specificity is respect. Fifteen minutes of real research puts you ahead of most candidates, who prepare answers about themselves but not about the company.`},

{q:"What are your greatest strengths and weaknesses?",level:"Foundational",tags:["Behavioral","Self-Awareness"],a:
`### Strengths — claim + evidence + relevance
Pick two that map to the job description, each backed by a story fragment.

"I'd say two. First, **translation between technical and business worlds** — my last three stakeholder reviews specifically mentioned making complex analysis usable; our CMO started bringing me to planning meetings for exactly that reason. Second, **systematic rigor** — I build validation into everything after being burned early in my career, and my analyses rarely come back with data challenges."

### Weaknesses — real + managed + improving
The formula: a genuine weakness, the mitigation system you've built, and evidence of progress.

"Earlier in my career I over-engineered. Given two weeks, I'd build the fully automated pipeline when a solid one-off answer would have served the decision. I've learned to match depth to stakes: I now explicitly ask 'is this a one-time question or a recurring one?' before choosing the approach. My manager's feedback last cycle noted my turnaround time improved significantly — though I'll admit the instinct to automate everything still tempts me weekly."

### Rules
- Strengths without evidence are just adjectives
- Never use fake weaknesses ("perfectionism," "I work too hard") — interviewers have heard them ten thousand times
- Never name a weakness that's core to the job ("I struggle with attention to detail" — fatal for an analyst)
- The weakness story should end on *progress*, not confession

> Self-awareness is the actual subject being graded. A candidate who knows their edges is coachable; one who performs flawlessness is a risk.`},

{q:"Do you have any questions for us?",level:"Foundational",tags:["Behavioral","Closing"],a:
`Always say yes — this is scored. Your questions reveal how you think about the role. Prepare more than you need; some get answered during the interview.

### Questions about the work
- "What does the data stack look like, and what's the biggest pain point in it today?"
- "Can you describe a recent analysis that actually changed a decision here?"
- "How are analysts' priorities set — embedded with teams, or a central queue?"
- "What would the first 90 days look like, and what would success at six months be?"

### Questions about the team and growth
- "How is the analytics team structured, and who would I collaborate with most?"
- "What separates analysts who thrive here from those who struggle?"
- "How do analysts grow here — is there a path toward senior, or toward data science?"

### Questions about the business (the differentiators)
- "What's the metric leadership cares most about this year, and how does this role move it?"
- "What's the hardest analytical problem the team hasn't solved yet?"

### For the hiring manager specifically
- "What do you wish you'd known before joining?"
- "What's your philosophy on how analysis should influence product decisions?"

### Avoid early
Salary, vacation, and "what does the company do?" — the first two belong to offer stage, the last signals zero preparation.

> The strongest closing question: "Based on our conversation, is there anything about my background that gives you hesitation? I'd love the chance to address it." It takes nerve — and it surfaces objections you can answer while you still can.`}
]},

num:9, title:"Machine Learning Essentials", short:"ML Basics",
intro:"Data analysts are rarely expected to build production models — but every modern interview expects fluency in the concepts. You'll collaborate with data scientists, evaluate model outputs, and increasingly use ML-powered tools yourself. These eight questions cover exactly the depth an analyst needs: enough to be credible, focused on judgment over mathematics.",
covers:["Supervised vs unsupervised learning","Overfitting & evaluation discipline","Precision, recall & metric trade-offs","When ML is the wrong tool"],
qa:[
{q:"What is the difference between supervised and unsupervised learning?",level:"Foundational",tags:["ML Fundamentals"],a:
`### Supervised learning
The model learns from **labeled examples** — input features paired with known outcomes — to predict outcomes for new data.

- **Regression:** predict a number (next month's revenue, house price)
- **Classification:** predict a category (churn/not, spam/not, fraud/not)

### Unsupervised learning
The model finds **structure in unlabeled data** — no right answers provided.

- **Clustering:** group similar items (customer segments)
- **Dimensionality reduction:** compress many features into few (PCA)
- **Association:** items that co-occur (market-basket analysis)

### Where analysts meet each
- Supervised: consuming churn scores, demand forecasts, lead scoring — and evaluating whether those models deserve trust
- Unsupervised: customer segmentation, anomaly detection, exploratory structure-finding

### The follow-up worth preempting
**Semi-supervised** (few labels + much unlabeled data) and **reinforcement learning** (learning by reward) exist, but the supervised/unsupervised split covers 95% of business ML.

> A crisp one-liner to memorize: "Supervised learns from answers; unsupervised searches for questions." Then ground it with a business example of each.`},

{q:"What is overfitting, and how do you detect and prevent it?",level:"Intermediate",tags:["ML Fundamentals","Modeling"],a:
`Overfitting is when a model **memorizes the training data — including its noise — instead of learning the underlying pattern**. It performs brilliantly on data it has seen and poorly on anything new.

### The analogy
A student who memorizes past exam papers scores 100% on those papers and fails the real exam. High training performance, low real-world performance.

### Detection
- **The gap:** training accuracy 99%, validation accuracy 74% — that gap *is* overfitting
- **Learning curves:** training error keeps falling while validation error rises
- Complexity red flags: a model with nearly as many parameters as data points

### Prevention
- **More data** — the most powerful cure
- **Simpler models** — fewer features, shallower trees, lower polynomial degree
- **Regularization** — penalize complexity (L1/L2)
- **Cross-validation** — evaluate on multiple held-out folds, not one lucky split
- **Early stopping / pruning** — for iterative and tree models
- **Feature discipline** — remove leaky and irrelevant features

### Why analysts should care
You'll evaluate vendor models and colleagues' models. Asking "how does it perform on data it hasn't seen?" — and knowing what a suspicious train/test gap looks like — protects your company from confident garbage.

> The sentence that signals understanding: "Overfitting is why we never trust a model's performance on its own training data."`},

{q:"Why do we split data into training and test sets?",level:"Foundational",tags:["ML Fundamentals","Evaluation"],a:
`Because a model's performance on the data it learned from is **meaningless** — it may have memorized rather than learned. The test set simulates the future: data the model has never touched.

### The standard practice
- **Training set (~70–80%):** the model learns from this
- **Test set (~20–30%):** used **once**, at the very end, for an unbiased performance estimate
- **Validation set** (or cross-validation): used during development for tuning — so the test set stays pristine

### The cardinal sin: data leakage
Information from the test set (or the future) bleeding into training. Subtle forms:
- Normalizing using statistics computed on the *whole* dataset before splitting
- Features that encode the outcome ('days_since_cancellation' in a churn model)
- Random splits on time-series data — the model trains on the future to predict the past; use **time-based splits** instead
- Duplicated entities across train and test (the same customer in both)

### The analyst's connection
This is the same logic as A/B testing: you can't evaluate an intervention on the data that inspired it. Honest evaluation requires untouched data — in experiments, in forecasting backtests, and in ML.

> Mentioning time-based splits for temporal data is the detail that separates memorized answers from practical understanding.`},

{q:"What are the assumptions of linear regression?",level:"Intermediate",tags:["Regression","Modeling"],a:
`Linear regression is often an analyst's first model — and its assumptions are frequently violated without consequence checks.

### The assumptions
1. **Linearity** — the relationship between predictors and outcome is actually linear (check: residual plots showing no curved patterns)
2. **Independence** — observations don't influence each other (violated by time series autocorrelation, clustered data)
3. **Homoscedasticity** — constant error variance across the prediction range (violated when residuals fan out — common with revenue data)
4. **Normality of residuals** — errors roughly normally distributed (matters for inference — p-values, intervals — more than for prediction)
5. **No perfect multicollinearity** — predictors shouldn't be near-duplicates of each other (check: VIF scores); high collinearity makes coefficients unstable and uninterpretable

### What violations cost
- Predictions may still be serviceable with mild violations — but **coefficients and their interpretations** ("each $1 of ad spend adds $3 of revenue") become unreliable
- Heteroscedasticity and autocorrelation produce overconfident standard errors — effects look more significant than they are

### Remedies
Transformations (log), adding missing terms, robust standard errors, or switching model families.

> The practical close: "I check residual plots before I quote any coefficient." That habit is what the question is really testing for.`},

{q:"Explain precision and recall, and when you'd optimize for each.",level:"Intermediate",tags:["Classification","Metrics"],a:
`For a classifier predicting a positive class (fraud, churn, disease):

### The confusion matrix
| | Predicted positive | Predicted negative |
| Actually positive | TP | **FN** (missed) |
| Actually negative | **FP** (false alarm) | TN |

### The metrics
- **Precision = TP / (TP + FP)** — of everything we *flagged*, how much was real? "When we cry wolf, how often is there a wolf?"
- **Recall = TP / (TP + FN)** — of all the *real* positives, how many did we catch? "How many wolves did we find?"

### The trade-off
Flag more aggressively → recall rises, precision falls (more false alarms). They're tuned via the classification threshold, and you cannot maximize both.

### When to favor which
- **High recall:** fraud detection, cancer screening, churn prediction — missing a positive is far costlier than a false alarm
- **High precision:** spam filtering, recommendations — false positives directly harm user experience, and a missed positive is tolerable

### Related metrics
- **F1 score** — harmonic mean of precision and recall, for balancing both
- **Accuracy is dangerous** with imbalanced classes: if 1% of transactions are fraud, a model predicting "never fraud" scores 99% accuracy and catches nothing

> The accuracy-paradox example is the highest-value detail here — it demonstrates you understand why metric selection itself is an analytical decision.`},

{q:"What is clustering, and where have you seen it used in business?",level:"Foundational",tags:["Unsupervised","Segmentation"],a:
`Clustering groups items so that members of a group are **more similar to each other than to other groups** — without any predefined labels.

### K-means in one paragraph
Choose k clusters; the algorithm assigns each point to the nearest cluster center, moves centers to their members' mean, and repeats until stable. Choosing k is part art: the **elbow method** (plot within-cluster variance against k, look for the bend) and, more importantly, *business interpretability* — four actionable segments beat nine mathematically-purer ones.

### Business applications
- **Customer segmentation** — group by purchase behavior, frequency, value; tailor marketing per segment
- **Product grouping** — items with similar sales patterns for inventory strategies
- **Anomaly detection** — points that fit no cluster well deserve investigation
- **Geographic analysis** — store or demand hotspots

### Critical caveats (the part that shows depth)
- **Scale your features** — k-means uses distances, so revenue in thousands will dominate engagement scores in single digits
- K-means assumes roughly spherical, similar-sized clusters — real segments are often messier
- Clusters are *descriptive, not causal* — a "high-value" cluster doesn't tell you how to create more of them
- Results need naming and validation with domain experts: a cluster nobody can describe is a cluster nobody will use

> The analyst's honest framing: clustering is an exploration and communication tool — the segments are hypotheses to validate, not truths discovered.`},

{q:"When should you NOT use machine learning?",level:"Advanced",tags:["Judgment","Strategy"],a:
`This question tests wisdom, not knowledge — and a thoughtful answer stands out enormously.

### When simpler is better
- **A rule works fine.** "Flag orders over $10,000 for review" needs no model. If a human can write the logic in three lines, ML adds complexity without value.
- **The data doesn't exist.** No labels, too few examples, or data that doesn't capture the outcome — no algorithm fixes absent signal.
- **The cost of errors is asymmetric and unforgiving.** High-stakes decisions (medical, legal, credit denial) demand interpretability and accountability that black-box models struggle to provide.
- **Interpretability is the point.** When the business needs to understand *why* — which levers drive churn — a transparent regression often beats an accurate opaque model.
- **The system changes faster than models can be retrained.** A model encoding last year's behavior in a rapidly shifting market decays into confident wrongness.
- **The ROI isn't there.** Development, maintenance, monitoring, and retraining have real costs; a model improving a metric by 0.3% may never pay for itself.

### The deeper principle
ML is a tool for **pattern recognition at scale**, not a substitute for domain understanding. The best practitioners are defined by what they decline to model.

> The memorable close: "The question is never 'can we build a model?' — it's 'will a model beat the simple alternative enough to justify its complexity?' Usually the honest answer starts with a pivot table."`},

{q:"What is feature engineering, and why does it matter?",level:"Intermediate",tags:["Modeling","Features"],a:
`Feature engineering is **transforming raw data into inputs that make patterns learnable** — and it's where domain knowledge enters machine learning.

### The classic examples
- **Dates → meaning:** a timestamp becomes day-of-week, month, is_weekend, is_holiday, days_since_signup. Models can't see "Monday" in '2024-03-11 09:42:13' until you extract it.
- **Ratios:** revenue per order, sessions per user, debt-to-income — relationships raw columns hide
- **Binning:** age → life-stage groups when the relationship isn't linear
- **Encoding categories:** one-hot for low-cardinality, target/frequency encoding for high
- **Aggregations:** a customer's average order over 90 days, count of support tickets last month — behavior summarized at the right grain
- **Text and interactions:** message length, sentiment scores, feature products (price × quantity)

### Why it matters more than algorithm choice
The consistent lesson of applied ML: **better features beat fancier models**. A logistic regression on thoughtful features routinely outperforms a neural network on raw ones. Kaggle competitions are won on features far more often than on exotic algorithms.

### The analyst's edge — and warning
Analysts are *uniquely* good at feature engineering because they understand the business semantics of the data. The warning: beware **leakage** — features computed using information that wouldn't exist at prediction time (like 'total refunds' in a model predicting first-purchase fraud).

> The line to land: "Feature engineering is how business understanding becomes model performance — it's the most analyst-shaped part of machine learning."`}
]}

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function inline(s){
  let t = esc(s);
  t = t.replace(/\{\{(.+?)\}\}/g,'<code class="ic">$1</code>');
  t = t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  t = t.replace(/\*([^*]+?)\*/g,'<em>$1</em>');
  return t;
}
function renderTable(t){
  const rows = t.split('\n').map(r=>r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim()));
  const head = rows[0];
  const body = rows.slice(1).filter(r=>!/^[-:\s]+$/.test(r.join('')));
  return `<div class="tw"><table><thead><tr>${head.map(h=>`<th>${inline(h)}</th>`).join('')}</tr></thead><tbody>${body.map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function renderMD(src){
  const out=[]; const blocks=src.trim().split(/\n\s*\n/);
  for(let b of blocks){
    const t=b.trim();
    if(t.startsWith('~~~')){
      const L=t.split('\n'); const lang=L[0].slice(3).trim()||'code';
      let body=L.slice(1); if(body.length && body[body.length-1].trim().startsWith('~~~')) body=body.slice(0,-1);
      out.push(`<div class="cb"><div class="cb-h"><span>${esc(lang)}</span></div><pre><code>${esc(body.join('\n'))}</code></pre></div>`); continue;
    }
    if(t.startsWith('### ')){ out.push(`<h4 class="ah">${inline(t.slice(4))}</h4>`); continue; }
    if(t.startsWith('> ')){ out.push(`<div class="tip"><span class="tip-l">Interview Tip</span><p>${inline(t.slice(2))}</p></div>`); continue; }
    if(t.startsWith('|')){ out.push(renderTable(t)); continue; }
    if(/^- /.test(t)){ out.push('<ul>'+t.split('\n').filter(x=>x.trim().startsWith('- ')).map(x=>`<li>${inline(x.trim().slice(2))}</li>`).join('')+'</ul>'); continue; }
    if(/^\d+\. /.test(t)){ out.push('<ol>'+t.split('\n').map(x=>`<li>${inline(x.trim().replace(/^\d+\.\s*/,''))}</li>`).join('')+'</ol>'); continue; }
    out.push(`<p>${inline(t)}</p>`);
  }
  return out.join('');
}
const plain = s => s.replace(/~~~\w*/g,' ').replace(/[*#>|{}`]/g,' ').replace(/\s+/g,' ').trim();

    <p style="text-align:center;font-style:italic;color:var(--muted);margin-top:10px;">— End of Book · Thank you for reading —</p>
    ${footHTML(TOTAL-1)}
  </div></div>`;
}
function renderPage(i){
  const p=PAGES[i];
  switch(p.type){
    case 'cover': return renderCover();
    case 'copyright': return renderCopyright();
    case 'preface': return renderPreface();
    case 'howto': return renderHowto();
    case 'toc': return renderTOC(p.part);
    case 'chapter': return renderChapter(p.ch);
    case 'qa': return renderQA(p.ch,p.qi,i);
    case 'end': return renderEnd();
  }
}
function pageTitle(i){
  const p=PAGES[i];
  if(p.type==='cover')return 'Cover';
  if(p.type==='copyright')return 'Copyright';
  if(p.type==='preface')return 'Preface';
  if(p.type==='howto')return 'How to Use This Book';
  if(p.type==='toc')return 'Table of Contents';
  if(p.type==='chapter')return 'Chapter '+CHAPTERS[p.ch].num+' — '+CHAPTERS[p.ch].title;
  if(p.type==='qa')return CHAPTERS[p.ch].qa[p.qi].q;
  return 'The Final Checklist';
}
function pageChLabel(i){
  const p=PAGES[i];
  if(p.type==='qa'||p.type==='chapter') return 'Ch '+CHAPTERS[p.ch].num+' · '+CHAPTERS[p.ch].short;
  return pageTitle(i);
}

/* ---- Navigation & flip ---- */
function setUnder(i){ under.innerHTML=renderPage(i); under.querySelector('.p-scroll').scrollTop=0; }
function goTo(i,dir){
  if(S.flipping||i===S.page||i<0||i>=TOTAL) return;
  dir = dir!==undefined?dir:(i>S.page?1:-1);
  S.flipping=true;
  const leaf=document.createElement('div');
  leaf.className='page leaf';
  const stage=$('stage');
  if(dir===1){
    leaf.innerHTML=under.innerHTML+'<div class="shade"></div>';
    const sc=under.querySelector('.p-scroll'); const lc=leaf.querySelector('.p-scroll');
    if(sc&&lc) lc.scrollTop=sc.scrollTop;
    setUnder(i); stage.appendChild(leaf);
    requestAnimationFrame(()=>requestAnimationFrame(()=>leaf.classList.add('out')));
    leaf.addEventListener('transitionend',()=>{ leaf.remove(); S.page=i; afterNav(); S.flipping=false; },{once:true});
  } else {
    setUnder(S.page);
    leaf.innerHTML=renderPage(i)+'<div class="shade"></div>';
    leaf.classList.add('in0'); stage.appendChild(leaf);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ leaf.classList.remove('in0'); leaf.classList.add('in1'); }));
    leaf.addEventListener('transitionend',()=>{ setUnder(i); leaf.remove(); S.page=i; afterNav(); S.flipping=false; },{once:true});
  }
}
const next=()=>goTo(S.page+1,1), prev=()=>goTo(S.page-1,-1);

function afterNav(){
  $('jump').value=S.page+1;
  $('progFill').style.width=((S.page+1)/TOTAL*100)+'%';
  $('chLabel').textContent=pageChLabel(S.page);
  updateBmBtn();
  localStorage.dap_page=S.page;
  const p=PAGES[S.page];
  if(window.gsap){
    if(p.type==='cover') gsap.fromTo('#pageUnder .anim',{y:26,opacity:0},{y:0,opacity:1,duration:.8,stagger:.09,ease:'power3.out'});
    else if(p.type==='chapter') gsap.fromTo('#pageUnder .anim2',{y:22,opacity:0},{y:0,opacity:1,duration:.7,stagger:.07,ease:'power3.out'});
    else gsap.fromTo('#pageUnder .p-inner',{opacity:0,y:10},{opacity:1,y:0,duration:.45,ease:'power2.out'});
  }
}

/* ---- Bookmarks ---- */
function updateBmBtn(){
  const on=S.bookmarks.includes(S.page);
  $('bmBtn').classList.toggle('active',on);
  $('bmBtn').querySelector('svg').setAttribute('fill',on?'#d4af37':'none');
}
function toggleBm(){
  const i=S.bookmarks.indexOf(S.page);
  if(i>=0){S.bookmarks.splice(i,1); toast('Bookmark removed');}
  else{S.bookmarks.push(S.page); toast('Bookmarked — page '+(S.page+1));}
  localStorage.dap_bm=JSON.stringify(S.bookmarks);
  updateBmBtn(); buildDrawer();
}

/* ---- Drawer ---- */
function buildDrawer(){
  let h='';
  h+=`<div style="padding:8px 20px 4px;font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:#79839a;">Chapters</div>`;
  TOC_ENTRIES.forEach(e=>{
    h+=`<div class="d-item" data-goto="${e.page}"><span class="dn">${e.n}</span><span class="dt">${esc(e.label)}</span><span class="dp">p.${e.page+1}</span></div>`;
  });
  h+=`<div style="padding:16px 20px 4px;font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:#79839a;">Bookmarks (${S.bookmarks.length})</div>`;
  if(!S.bookmarks.length) h+=`<div style="padding:6px 20px;font-size:12px;color:#5d6678;">Press B on any page to save it here.</div>`;
  [...S.bookmarks].sort((a,b)=>a-b).forEach(b=>{
    h+=`<div class="d-item" data-goto="${b}"><span class="dn" style="color:#d4af37;">◆</span><span class="dt" style="font-size:12.5px;">${esc(pageTitle(b).slice(0,42))}${pageTitle(b).length>42?'…':''}</span><span class="dp">p.${b+1}</span></div>`;
  });
  $('drawerList').innerHTML=h;
}

/* ---- Search ---- */
let SEARCH_IDX=null;
function buildSearch(){
  SEARCH_IDX=PAGES.map((p,i)=>{
    let text='';
    if(p.type==='qa'){const q=CHAPTERS[p.ch].qa[p.qi]; text=q.q+' '+plain(q.a)+' '+q.tags.join(' ');}
    else if(p.type==='chapter'){text=CHAPTERS[p.ch].title+' '+CHAPTERS[p.ch].intro;}
    else text=pageTitle(i);
    return {i,title:pageTitle(i),text};
  });
}
function doSearch(q){
  const res=$('sRes');
  if(!q||q.length<2){res.innerHTML=`<div style="text-align:center;color:#5d6678;font-size:13px;padding:40px 0;">Type at least 2 characters to search ${TOTAL} pages…</div>`;return;}
  const ql=q.toLowerCase();
  const hits=SEARCH_IDX.filter(e=>e.text.toLowerCase().includes(ql)).slice(0,30);
  if(!hits.length){res.innerHTML=`<div style="text-align:center;color:#5d6678;font-size:13px;padding:40px 0;">No results for “${esc(q)}”.</div>`;return;}
  res.innerHTML=hits.map(h=>{
    const pos=h.text.toLowerCase().indexOf(ql);
    const snip=h.text.slice(Math.max(0,pos-55),pos+95);
    const hl=esc(snip).replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');
    return `<div class="s-item" data-goto="${h.i}"><div class="sp">PAGE ${h.i+1}</div><div class="st">${esc(h.title.slice(0,80))}</div><div class="ss">…${hl}…</div></div>`;
  }).join('');
}

/* ---- Toast ---- */
let toastT=null;
function toast(msg,btn,cb){
  $('toastMsg').textContent=msg;
  const b=$('toastBtn');
  if(btn){b.style.display='';b.textContent=btn;b.onclick=()=>{$('toast').classList.remove('on');cb&&cb();};}
  else b.style.display='none';
  $('toast').classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>$('toast').classList.remove('on'),4200);
}

/* ---- Theme & font size ---- */
function applyTheme(){
  document.body.classList.remove('theme-parchment','theme-paper');
  if(S.theme==='parchment')document.body.classList.add('theme-parchment');
  if(S.theme==='paper')document.body.classList.add('theme-paper');
  localStorage.dap_theme=S.theme;
}
function applyFs(){
  const map={s:'15px',m:'16.5px',l:'18.5px'};
  document.documentElement.style.setProperty('--pfs',map[S.fs]);
  localStorage.dap_fs=S.fs;
}

/* ---- Events ---- */
$('nextBtn').onclick=next; $('prevBtn').onclick=prev;
$('arrR').onclick=next; $('arrL').onclick=prev;
$('jump').addEventListener('keydown',e=>{
  if(e.key==='Enter'){const v=parseInt(e.target.value,10); if(v>=1&&v<=TOTAL) goTo(v-1); else e.target.value=S.page+1; e.target.blur();}
});
$('menuBtn').onclick=()=>{buildDrawer();$('drawer').classList.add('open');$('scrim').classList.add('on');};
$('drawerClose').onclick=$('scrim').onclick=()=>{$('drawer').classList.remove('open');$('scrim').classList.remove('on');};
$('brandHome').onclick=()=>goTo(0);
$('bmBtn').onclick=toggleBm;
$('practiceBtn').onclick=()=>{
  S.practice=!S.practice; localStorage.dap_practice=S.practice?'1':'0';
  $('practiceBtn').classList.toggle('active',S.practice);
  toast(S.practice?'Practice Mode on — answers hidden until revealed':'Practice Mode off — answers visible');
  setUnder(S.page);
};
$('searchBtn').onclick=()=>{$('searchOv').classList.add('on');setTimeout(()=>$('sInput').focus(),60);doSearch($('sInput').value);};
$('sClose').onclick=()=>$('searchOv').classList.remove('on');
$('sInput').addEventListener('input',e=>doSearch(e.target.value.trim()));
$('themeBtn').onclick=()=>{
  S.theme=S.theme==='midnight'?'parchment':S.theme==='parchment'?'paper':'midnight';
  applyTheme(); toast('Theme: '+S.theme.charAt(0).toUpperCase()+S.theme.slice(1));
};
$('fsBtn').onclick=()=>{
  S.fs=S.fs==='s'?'m':S.fs==='l'?'s':'l';
  applyFs(); toast('Text size: '+({s:'Compact',m:'Comfortable',l:'Large'})[S.fs]);
};
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-goto]');
  if(g){ const i=parseInt(g.dataset.goto,10); $('drawer').classList.remove('open'); $('scrim').classList.remove('on'); $('searchOv').classList.remove('on'); goTo(i); return; }
  const r=e.target.closest('[data-reveal]');
  if(r){ S.revealed.add(parseInt(r.dataset.reveal,10)); setUnder(S.page); }
});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'){ if(e.key==='Escape')e.target.blur(); return; }
  if($('searchOv').classList.contains('on')){ if(e.key==='Escape')$('searchOv').classList.remove('on'); return; }
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'){e.preventDefault();prev();}
  else if(e.key==='/'){e.preventDefault();$('searchBtn').click();}
  else if(e.key==='b'||e.key==='B'){toggleBm();}
  else if(e.key==='Escape'){$('drawer').classList.remove('open');$('scrim').classList.remove('on');}
});
let tx0=0,ty0=0;
document.addEventListener('touchstart',e=>{tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx0, dy=e.changedTouches[0].clientY-ty0;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6){ dx<0?next():prev(); }
},{passive:true});

/* ---- Init ---- */
$('totalPages').textContent=TOTAL;
applyTheme(); applyFs();
$('practiceBtn').classList.toggle('active',S.practice);
buildSearch(); buildDrawer();
setUnder(0); afterNav();
const saved=parseInt(localStorage.dap_page||'0',10);
if(saved>2) toast('Welcome back — you were on page '+(saved+1),'Resume',()=>goTo(saved));
</script>
</body>
</html>
